services:
  egress:
    # Pinned tag + digest (the same image "latest" pointed to). Update with:
    # curl -s https://hub.docker.com/v2/repositories/ubuntu/squid/tags/<tag> (read "digest").
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    read_only: true
    tmpfs:
      # Squid only needs these paths to start. The sizes are the disk cap while it runs.
      - /tmp:size=8m,mode=1777
      - /var/spool/squid:size=4m,mode=1777
      - /var/log/squid:size=1m,mode=1777
      - /run:size=1m,mode=1777
    volumes:
      - type: bind
        source: ./squid.conf
        target: /etc/squid/squid.conf
        read_only: true
    # 520 MB of headroom so Docker does not kill the proxy during a live round.
    mem_limit: 520m
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      agents:
        aliases: [egress]
      internet: {}
    restart: unless-stopped
networks:
  agents:
    name: stram_agents
    internal: true
  internet: {}
  previews:
    name: stram_previews
    internal: true
