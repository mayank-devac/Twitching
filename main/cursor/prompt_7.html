<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nocturne</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07060f;
    color: #f4fbff;
    font-family: Georgia, "Times New Roman", serif;
  }
  body {
    position: relative;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #sky {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }
  .mast {
    position: absolute;
    top: 6.5%;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }
  .word {
    font-size: 64px;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    line-height: 1;
    color: #fff8ff;
    text-shadow:
      0 0 6px #fff,
      0 0 18px #ff4ad8,
      0 0 42px #ff2bd6,
      0 0 80px rgba(122, 43, 255, 0.85);
    animation: flicker 5.5s infinite;
  }
  .sub {
    margin-top: 12px;
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 15px;
    letter-spacing: 0.62em;
    text-indent: 0.62em;
    text-transform: lowercase;
    color: rgba(214, 255, 252, 0.78);
    text-shadow: 0 0 12px rgba(61, 255, 242, 0.65);
  }
  .rule {
    width: 180px;
    height: 1px;
    margin: 16px auto 0;
    background: linear-gradient(90deg, transparent, #3dfff2, #ff2bd6, transparent);
    box-shadow: 0 0 10px #3dfff2;
  }
  .piano {
    position: absolute;
    z-index: 3;
    left: 4.5%;
    right: 4.5%;
    bottom: 34px;
    padding: 0 16px 8px;
    perspective: 980px;
  }
  .piano::before,
  .piano::after {
    content: "";
    position: absolute;
    top: 36px;
    bottom: 22px;
    width: 7px;
    border-radius: 8px;
    background: linear-gradient(#ff4ad8, #7a5cff, #3dfff2);
    box-shadow: 0 0 14px #ff2bd6, 0 0 28px rgba(61, 255, 242, 0.45);
    pointer-events: none;
  }
  .piano::before { left: 0; }
  .piano::after { right: 0; }
  .deck {
    transform: rotateX(13deg);
    transform-origin: 50% 100%;
  }
  .lid {
    height: 78px;
    margin: 0 7% -6px;
    background:
      linear-gradient(180deg, rgba(61, 255, 242, 0.18), rgba(10, 6, 18, 0.15) 42%),
      linear-gradient(90deg, #120814, #311848 48%, #120814);
    clip-path: polygon(7% 100%, 93% 100%, 100% 0, 0 0);
    box-shadow: inset 0 2px 0 rgba(180, 255, 250, 0.85);
    filter: drop-shadow(0 0 14px rgba(255, 43, 214, 0.35));
    position: relative;
  }
  .lid span {
    position: absolute;
    left: 50%;
    top: 16px;
    width: 46px;
    height: 28px;
    margin-left: -23px;
    border: 1px solid rgba(255, 193, 77, 0.8);
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(255, 193, 77, 0.7);
  }
  .fall {
    height: 13px;
    margin-top: 8px;
    border-radius: 3px;
    background:
      repeating-linear-gradient(90deg, transparent 0 26px, rgba(255, 193, 77, 0.95) 26px 28px),
      linear-gradient(180deg, #4a305c, #1a1024);
    box-shadow: 0 0 14px rgba(255, 43, 214, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .kb {
    position: relative;
    height: 292px;
    margin-top: 0;
    display: flex;
    border-radius: 0 0 10px 10px;
    background: #0a0810;
    box-shadow:
      0 16px 30px rgba(0, 0, 0, 0.45),
      inset 0 0 0 2px rgba(255, 255, 255, 0.04);
    overflow: hidden;
  }
  .wkey, .bkey {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .wkey {
    position: relative;
    flex: 1 1 0;
    height: 100%;
    box-sizing: border-box;
    border-left: 1px solid rgba(40, 30, 20, 0.35);
    border-right: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 0 0 7px 7px;
    background: linear-gradient(180deg, #fffdf8 0%, #efe7db 58%, #d4cbbd 100%);
    box-shadow: inset 0 -12px 14px rgba(70, 50, 30, 0.16);
    transition: background 0.07s linear, box-shadow 0.07s linear;
  }
  .wkey::after {
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    top: 0;
    height: 34%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), transparent);
    pointer-events: none;
  }
  .wkey.lit {
    background: linear-gradient(180deg, #ffffff 0%, #d9fff8 38%, #5ef3ff 100%);
    box-shadow:
      0 0 18px #3dfff2,
      0 0 36px rgba(61, 255, 242, 0.75),
      inset 0 0 22px rgba(180, 255, 252, 0.95);
    z-index: 1;
  }
  .bkey {
    position: absolute;
    top: 0;
    height: 61%;
    border-radius: 0 0 5px 5px;
    z-index: 2;
    background: linear-gradient(180deg, #3a3a44 0%, #121218 38%, #050508 100%);
    box-shadow:
      inset 0 -8px 8px rgba(0, 0, 0, 0.65),
      2px 6px 8px rgba(0, 0, 0, 0.45);
    transition: background 0.07s linear, box-shadow 0.07s linear;
  }
  .bkey.lit {
    background: linear-gradient(180deg, #ffd6f6 0%, #ff4ad8 42%, #6a1248 100%);
    box-shadow:
      0 0 16px #ff2bd6,
      0 0 32px rgba(255, 43, 214, 0.8),
      inset 0 0 12px rgba(255, 255, 255, 0.65);
  }
  .underlight {
    height: 22px;
    margin-top: 10px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(61, 255, 242, 0.7), rgba(255, 43, 214, 0.28) 42%, transparent 72%);
    filter: blur(1px);
    animation: pulse 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 36%, rgba(0, 0, 0, 0.5) 100%);
  }
  @keyframes flicker {
    0%, 19%, 21%, 55%, 57%, 100% { opacity: 1; }
    20%, 56% { opacity: 0.72; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scaleX(0.92); }
    50% { opacity: 1; transform: scaleX(1); }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="mast">
  <div class="word">Nocturne</div>
  <div class="sub">violet hour</div>
  <div class="rule"></div>
</div>
<div class="piano">
  <div class="deck">
    <div class="lid"><span></span></div>
    <div class="fall"></div>
    <div class="kb" id="kb"></div>
  </div>
  <div class="underlight"></div>
</div>
<div class="vignette"></div>
<script>
(function () {
  var SCALE = [
    ["C4", 261.63, false], ["C#4", 277.18, true], ["D4", 293.66, false],
    ["D#4", 311.13, true], ["E4", 329.63, false], ["F4", 349.23, false],
    ["F#4", 369.99, true], ["G4", 392.0, false], ["G#4", 415.3, true],
    ["A4", 440.0, false], ["A#4", 466.16, true], ["B4", 493.88, false],
    ["C5", 523.25, false], ["C#5", 554.37, true], ["D5", 587.33, false],
    ["D#5", 622.25, true], ["E5", 659.25, false], ["F5", 698.46, false],
    ["F#5", 739.99, true], ["G5", 783.99, false], ["G#5", 830.61, true],
    ["A5", 880.0, false], ["A#5", 932.33, true], ["B5", 987.77, false],
    ["C6", 1046.5, false]
  ];
  var PHRASE = [
    ["A4", 0, 0.48], ["C5", 460, 0.48], ["E5", 920, 0.7], ["A5", 1560, 0.46],
    ["G5", 2060, 0.36], ["E5", 2460, 0.36], ["C5", 2860, 0.62],
    ["D5", 3720, 0.4], ["F5", 4160, 0.4], ["A5", 4600, 0.66],
    ["G5", 5340, 0.3], ["F5", 5680, 0.3], ["E5", 6020, 0.3], ["D5", 6360, 0.34],
    ["C5", 6840, 0.78], ["B4", 7780, 0.36], ["A4", 8180, 0.36], ["G4", 8580, 0.4],
    ["A4", 9160, 1.15]
  ];
  var LOOP = 11400;

  var sky = document.getElementById("sky");
  var g = sky.getContext("2d");
  var kb = document.getElementById("kb");
  var keys = {};
  var freqs = {};
  var timers = {};
  var actx = null;
  var motes = [];
  var buildings = [];
  var stars = [];
  var W = 1, H = 1;

  for (var i = 0; i < 90; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random() * 0.58,
      r: Math.random() * 1.35 + 0.25,
      p: Math.random() * Math.PI * 2,
      s: 0.6 + Math.random() * 1.8
    });
  }

  function buildKeys() {
    var whites = SCALE.filter(function (n) { return !n[2]; });
    var count = whites.length;
    var slot = 100 / count;
    var blackW = slot * 0.56;
    var whiteIndex = -1;
    SCALE.forEach(function (n) {
      freqs[n[0]] = n[1];
      var el = document.createElement("div");
      el.className = n[2] ? "bkey" : "wkey";
      if (n[2]) {
        var left = (whiteIndex + 1) * slot - blackW / 2;
        el.style.left = left + "%";
        el.style.width = blackW + "%";
      } else {
        whiteIndex++;
      }
      keys[n[0]] = el;
      kb.appendChild(el);
      el.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        strike(n[0], 0.7);
      });
    });
  }

  function audio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!actx) actx = new AC();
    if (actx.state === "suspended") actx.resume().catch(function () {});
    return actx;
  }

  function tone(freq, dur) {
    var c = audio();
    if (!c || c.state !== "running") return;
    var now = c.currentTime;
    var master = c.createGain();
    master.gain.setValueAtTime(0.85, now);
    master.connect(c.destination);

    var body = c.createOscillator();
    body.type = "triangle";
    body.frequency.setValueAtTime(freq, now);
    var bg = c.createGain();
    bg.gain.setValueAtTime(0.0001, now);
    bg.gain.exponentialRampToValueAtTime(0.22, now + 0.018);
    bg.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    body.connect(bg);
    bg.connect(master);

    var partial = c.createOscillator();
    partial.type = "sine";
    partial.frequency.setValueAtTime(freq * 2.003, now);
    var pg = c.createGain();
    pg.gain.setValueAtTime(0.0001, now);
    pg.gain.exponentialRampToValueAtTime(0.055, now + 0.012);
    pg.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.72);
    partial.connect(pg);
    pg.connect(master);

    var samples = Math.floor(c.sampleRate * 0.045);
    var buf = c.createBuffer(1, samples, c.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < samples; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / samples);
    }
    var src = c.createBufferSource();
    src.buffer = buf;
    var bp = c.createBiquadFilter();
    bp.type = "highpass";
    bp.frequency.value = 900;
    var ng = c.createGain();
    ng.gain.value = 0.12;
    src.connect(bp);
    bp.connect(ng);
    ng.connect(master);

    body.start(now);
    partial.start(now);
    src.start(now);
    body.stop(now + dur + 0.04);
    partial.stop(now + dur + 0.04);
  }

  function burst(name) {
    var el = keys[name];
    if (!el) return;
    var k = el.getBoundingClientRect();
    var c = sky.getBoundingClientRect();
    var x = k.left - c.left + k.width / 2;
    var y = k.top - c.top + 12;
    var color = el.className.indexOf("bkey") >= 0 ? "#ff4ad8" : "#7af6ff";
    for (var i = 0; i < 9; i++) {
      motes.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 50,
        vy: -28 - Math.random() * 80,
        life: 1,
        decay: 0.01 + Math.random() * 0.012,
        color: color,
        s: 1.2 + Math.random() * 2.2
      });
    }
  }

  function strike(name, dur) {
    var el = keys[name];
    if (!el) return;
    el.classList.add("lit");
    clearTimeout(timers[name]);
    timers[name] = setTimeout(function () {
      el.classList.remove("lit");
    }, Math.max(160, dur * 900));
    tone(freqs[name], dur);
    burst(name);
  }

  function playDemo() {
    PHRASE.forEach(function (step) {
      setTimeout(function () { strike(step[0], step[2]); }, step[1]);
    });
    setTimeout(playDemo, LOOP);
  }

  function buildCity() {
    buildings = [];
    var x = -8;
    var base = H * 0.5;
    while (x < W + 10) {
      var bw = 26 + Math.random() * 54;
      var bh = 36 + Math.random() * (H * 0.22);
      var wins = [];
      var cols = Math.max(2, Math.floor(bw / 12));
      var rows = Math.max(2, Math.floor(bh / 16));
      for (var cx = 0; cx < cols; cx++) {
        for (var ry = 0; ry < rows; ry++) {
          if (Math.random() > 0.35) {
            wins.push({
              x: 4 + cx * ((bw - 8) / cols),
              y: 6 + ry * ((bh - 10) / rows),
              on: Math.random() > 0.25,
              hue: Math.random() > 0.82 ? "#ffc14d" : "#d7fff8"
            });
          }
        }
      }
      buildings.push({
        x: x,
        w: bw,
        h: bh,
        base: base,
        wins: wins,
        edge: Math.random() > 0.5 ? "rgba(61,255,242,0.45)" : "rgba(255,43,214,0.4)"
      });
      x += bw + 5 + Math.random() * 8;
    }
  }

  function fit() {
    var rect = sky.getBoundingClientRect();
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    sky.width = W;
    sky.height = H;
    buildCity();
  }

  function loop(t) {
    g.fillStyle = "#07060f";
    g.fillRect(0, 0, W, H);

    var neb = g.createRadialGradient(W * 0.5, H * 0.22, 20, W * 0.5, H * 0.3, W * 0.7);
    neb.addColorStop(0, "rgba(92, 28, 120, 0.55)");
    neb.addColorStop(0.45, "rgba(24, 18, 70, 0.35)");
    neb.addColorStop(1, "rgba(7, 6, 15, 0)");
    g.fillStyle = neb;
    g.fillRect(0, 0, W, H);

    var wash = g.createRadialGradient(W * 0.78 + Math.sin(t * 0.0002) * 20, H * 0.16, 10, W * 0.78, H * 0.16, W * 0.28);
    wash.addColorStop(0, "rgba(255, 186, 120, 0.18)");
    wash.addColorStop(1, "rgba(255, 186, 120, 0)");
    g.fillStyle = wash;
    g.fillRect(0, 0, W, H);

    var mx = W * 0.8;
    var my = H * 0.15;
    var mr = Math.min(W, H) * 0.075;
    g.beginPath();
    g.fillStyle = "#f6efe2";
    g.arc(mx, my, mr, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.fillStyle = "#07060f";
    g.arc(mx + mr * 0.42, my - mr * 0.08, mr * 0.82, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.strokeStyle = "rgba(255, 214, 160, 0.35)";
    g.lineWidth = 2;
    g.arc(mx, my, mr + 10, 0.4, 1.5);
    g.stroke();

    stars.forEach(function (s) {
      var a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.002 * s.s + s.p));
      g.fillStyle = "rgba(255,255,255," + a + ")";
      g.beginPath();
      g.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      g.fill();
    });

    var beam = (t * 0.03) % (W + 200) - 100;
    var lg = g.createLinearGradient(beam, 0, beam + 80, H * 0.5);
    lg.addColorStop(0, "rgba(61,255,242,0)");
    lg.addColorStop(0.5, "rgba(180,140,255,0.05)");
    lg.addColorStop(1, "rgba(61,255,242,0)");
    g.fillStyle = lg;
    g.fillRect(beam, 0, 80, H * 0.55);

    buildings.forEach(function (b) {
      g.fillStyle = "rgba(8, 6, 16, 0.92)";
      g.fillRect(b.x, b.base - b.h, b.w, b.h);
      g.strokeStyle = b.edge;
      g.lineWidth = 1;
      g.strokeRect(b.x + 0.5, b.base - b.h + 0.5, b.w - 1, b.h);
      b.wins.forEach(function (w) {
        if (Math.random() < 0.004) w.on = !w.on;
        g.fillStyle = w.on ? w.hue : "rgba(20,16,28,0.9)";
        g.globalAlpha = w.on ? 0.85 : 0.5;
        g.fillRect(b.x + w.x, b.base - b.h + w.y, 3.2, 4.2);
        g.globalAlpha = 1;
      });
    });

    var hz = g.createLinearGradient(0, H * 0.48, 0, H * 0.62);
    hz.addColorStop(0, "rgba(255, 43, 214, 0)");
    hz.addColorStop(0.5, "rgba(255, 43, 214, 0.18)");
    hz.addColorStop(1, "rgba(61, 255, 242, 0)");
    g.fillStyle = hz;
    g.fillRect(0, H * 0.48, W, H * 0.16);

    for (var i = motes.length - 1; i >= 0; i--) {
      var m = motes[i];
      m.x += m.vx * 0.016;
      m.y += m.vy * 0.016;
      m.vy += 18 * 0.016;
      m.life -= m.decay;
      if (m.life <= 0) {
        motes.splice(i, 1);
        continue;
      }
      g.globalAlpha = Math.max(0, m.life);
      g.fillStyle = m.color;
      g.beginPath();
      g.arc(m.x, m.y, m.s, 0, Math.PI * 2);
      g.fill();
      g.globalAlpha = 1;
    }

    requestAnimationFrame(loop);
  }

  window.addEventListener("pointerdown", function () { audio(); }, { passive: true });
  kb.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("resize", fit);
  buildKeys();
  fit();
  requestAnimationFrame(loop);
  playDemo();
})();
</script>
</body>
</html>
