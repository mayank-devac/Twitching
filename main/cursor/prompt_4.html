<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Nocturne</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07010f;
    touch-action: none;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
    color: #e9fbff;
    user-select: none;
    -webkit-user-select: none;
  }
  #scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .mark {
    position: absolute;
    top: 6.2%;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 2;
  }
  .mark span {
    display: block;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: lowercase;
    color: rgba(226, 255, 252, 0.88);
    text-shadow:
      0 0 12px rgba(61, 255, 242, 0.75),
      0 0 32px rgba(255, 43, 214, 0.35);
  }
  .mark i {
    display: block;
    width: 148px;
    height: 1px;
    margin: 14px auto 0;
    background: linear-gradient(90deg, transparent, #3dfff2, #ff2bd6, transparent);
    box-shadow: 0 0 10px rgba(61, 255, 242, 0.8);
  }
  .piano-wrap {
    position: absolute;
    left: 50%;
    bottom: 72px;
    transform: translateX(-50%);
    width: min(900px, 94%);
    z-index: 3;
    -webkit-box-reflect: below 8px linear-gradient(rgba(255,255,255,0.28), rgba(255,255,255,0.02) 42%, transparent 62%);
  }
  .piano {
    position: relative;
    padding: 16px 14px 14px;
    border-radius: 16px 16px 18px 18px;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(90, 40, 120, 0.35), transparent 55%),
      linear-gradient(180deg, #1a0c28 0%, #0a0612 100%);
    box-shadow:
      0 0 0 1px rgba(120, 255, 244, 0.28),
      0 0 40px rgba(255, 43, 214, calc(0.08 + var(--energy, 0) * 0.28)),
      0 24px 60px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }
  .lid {
    height: 22px;
    margin: 2px 10px 12px;
    border-radius: 8px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(61, 255, 242, 0.15) 12%,
      rgba(61, 255, 242, 0.85) 38%,
      rgba(255, 43, 214, 0.9) 62%,
      rgba(120, 180, 255, 0.45) 86%,
      transparent 100%);
    box-shadow:
      0 0 calc(10px + var(--energy, 0) * 26px) rgba(61, 255, 242, 0.55),
      0 0 calc(18px + var(--energy, 0) * 30px) rgba(255, 43, 214, 0.35);
    opacity: calc(0.55 + var(--energy, 0) * 0.45);
  }
  .keys {
    position: relative;
    display: flex;
    gap: 3px;
    height: 248px;
    overflow: hidden;
  }
  .white, .black {
    cursor: pointer;
    transition: background 90ms linear, box-shadow 140ms linear, transform 80ms ease;
  }
  .white {
    position: relative;
    z-index: 1;
    flex: 1 1 0;
    height: 100%;
    border-radius: 0 0 8px 8px;
    border: 1px solid rgba(170, 245, 255, 0.22);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.16), transparent 28%),
      linear-gradient(180deg, #241833 0%, #120b1c 42%, #1a1028 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), inset 0 -18px 24px rgba(0,0,0,0.35);
  }
  .white::after {
    content: "";
    position: absolute;
    left: 14%;
    right: 14%;
    top: 0;
    height: 34%;
    background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent);
    pointer-events: none;
  }
  .white.lit {
    transform: translateY(4px);
    background:
      linear-gradient(180deg, #ffffff 0%, hsl(var(--h), 100%, 72%) 18%, hsl(var(--h), 95%, 42%) 55%, hsl(var(--h), 80%, 18%) 100%);
    box-shadow:
      0 0 16px hsl(var(--h), 100%, 64%),
      0 0 42px hsl(var(--h), 100%, 56%),
      inset 0 0 16px rgba(255,255,255,0.65);
    border-color: rgba(255,255,255,0.7);
  }
  .black {
    position: absolute;
    top: 0;
    height: 61%;
    z-index: 2;
    border-radius: 0 0 5px 5px;
    border: 1px solid rgba(255, 140, 220, 0.35);
    background: linear-gradient(180deg, #2a1238 0%, #07040c 70%);
    box-shadow:
      0 10px 12px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .black.lit {
    transform: translateY(3px);
    background: linear-gradient(180deg, #fff 0%, hsl(var(--h), 100%, 68%) 16%, hsl(var(--h), 90%, 32%) 100%);
    box-shadow:
      0 0 14px hsl(var(--h), 100%, 62%),
      0 0 28px hsl(var(--h), 100%, 50%);
    border-color: rgba(255,255,255,0.8);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="mark"><span>neon nocturne</span><i></i></div>
<div class="piano-wrap">
  <div class="piano">
    <div class="lid"></div>
    <div class="keys" id="keys"></div>
  </div>
</div>
<script>
(function () {
  var START = 60;
  var END = 84;
  var BLACK = {1:1, 3:1, 6:1, 8:1, 10:1};
  var PHRASE = [
    [72, 0.38], [76, 0.38], [79, 0.42], [84, 0.72],
    [81, 0.26], [79, 0.26], [76, 0.52], [74, 0.28], [72, 0.78],
    [[60, 67], 0.42], [70, 0.32], [72, 0.95],
    [0, 0.55],
    [64, 0.3], [67, 0.3], [72, 0.4], [76, 0.42], [79, 0.48],
    [76, 0.28], [72, 0.28], [[55, 67], 0.9],
    [0, 1.15]
  ];
  var KEYMAP = {
    a:60, w:61, s:62, e:63, d:64, f:65, t:66, g:67,
    y:68, h:69, u:70, j:71, k:72, o:73, l:74, p:75,
    ";":76, "'":77
  };

  var keysEl = document.getElementById("keys");
  var canvas = document.getElementById("scene");
  var gfx = canvas.getContext("2d");
  var keyByMidi = {};
  var whites = [];
  var blacks = [];
  var pointerDown = false;
  var lastUser = 0;
  var energy = 0;
  var demoIndex = 0;
  var ctx = null;
  var master = null;
  var delaySend = null;
  var buildings = [];
  var stars = [];
  var rain = [];
  var motes = [];
  var builtW = 0;

  function hueFor(m) {
    return 168 + ((m - 48) / 36) * 160;
  }

  function makeKey(midi, kind) {
    var el = document.createElement("div");
    el.className = kind;
    el.dataset.midi = String(midi);
    var hue = hueFor(midi);
    el.style.setProperty("--h", hue.toFixed(1));
    el.dataset.hue = String(hue);
    el.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      pointerDown = true;
      userPlay(midi);
    });
    el.addEventListener("pointerenter", function () {
      if (pointerDown) userPlay(midi);
    });
    keyByMidi[midi] = el;
    return el;
  }

  for (var m = START; m <= END; m++) {
    if (BLACK[m % 12]) blacks.push(m);
    else whites.push(m);
  }
  whites.forEach(function (midi) { keysEl.appendChild(makeKey(midi, "white")); });
  blacks.forEach(function (midi) { keysEl.appendChild(makeKey(midi, "black")); });

  function placeBlacks() {
    var host = keysEl.getBoundingClientRect();
    if (!host.width) return;
    blacks.forEach(function (midi) {
      var prev = keyByMidi[midi - 1];
      var el = keyByMidi[midi];
      var r = prev.getBoundingClientRect();
      var w = r.width * 0.64;
      el.style.width = w + "px";
      el.style.left = (r.right - host.left - w * 0.52) + "px";
    });
  }

  function audio() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.42;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 10;
    comp.ratio.value = 3.2;
    comp.attack.value = 0.004;
    comp.release.value = 0.22;
    master.connect(comp);
    comp.connect(ctx.destination);
    var delay = ctx.createDelay();
    delay.delayTime.value = 0.28;
    var fb = ctx.createGain();
    fb.gain.value = 0.3;
    var damp = ctx.createBiquadFilter();
    damp.type = "lowpass";
    damp.frequency.value = 2400;
    delay.connect(damp);
    damp.connect(fb);
    fb.connect(delay);
    delay.connect(master);
    delaySend = delay;
    return ctx;
  }

  function tone(midi, dur, vel) {
    var ac = audio();
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    var now = ac.currentTime;
    var freq = 440 * Math.pow(2, (midi - 69) / 12);
    var osc = ac.createOscillator();
    var osc2 = ac.createOscillator();
    var filter = ac.createBiquadFilter();
    var gain = ac.createGain();
    var send = ac.createGain();
    osc.type = "triangle";
    osc2.type = "sine";
    osc.frequency.setValueAtTime(freq, now);
    osc2.frequency.setValueAtTime(freq * 2.003, now);
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(900, now);
    filter.frequency.exponentialRampToValueAtTime(2800, now + 0.05);
    filter.frequency.exponentialRampToValueAtTime(700, now + dur);
    filter.Q.value = 0.7;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.02, vel), now + 0.018);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(0.12, dur));
    send.gain.value = 0.34;
    var partial = ac.createGain();
    partial.gain.value = 0.22;
    osc.connect(filter);
    osc2.connect(partial);
    partial.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    gain.connect(send);
    send.connect(delaySend);
    osc.start(now);
    osc2.start(now);
    osc.stop(now + dur + 0.08);
    osc2.stop(now + dur + 0.08);
  }

  function flash(midi, ms) {
    var el = keyByMidi[midi];
    if (!el) return;
    var token = (el._tok || 0) + 1;
    el._tok = token;
    el.classList.add("lit");
    setTimeout(function () {
      if (el._tok === token) el.classList.remove("lit");
    }, ms);
  }

  function burst(midi) {
    var el = keyByMidi[midi];
    if (!el) return;
    var r = el.getBoundingClientRect();
    motes.push({
      x: r.left + r.width / 2,
      y: r.top + 8,
      vx: (Math.random() - 0.5) * 0.7,
      vy: -0.45 - Math.random() * 0.8,
      life: 1,
      hue: hueFor(midi),
      s: 1.5 + Math.random() * 2.4
    });
    energy = Math.min(1, energy + 0.34);
  }

  function play(slot, dur, vel) {
    var list = Array.isArray(slot) ? slot : [slot];
    list.forEach(function (midi) {
      if (!midi) return;
      tone(midi, dur, vel);
      flash(midi, Math.max(160, dur * 820));
      burst(midi);
    });
  }

  function userPlay(midi) {
    lastUser = performance.now();
    play(midi, 1.05, 0.2);
  }

  function stepDemo() {
    if (performance.now() - lastUser < 1500) {
      setTimeout(stepDemo, 240);
      return;
    }
    var step = PHRASE[demoIndex];
    demoIndex = (demoIndex + 1) % PHRASE.length;
    var slot = step[0];
    var dur = step[1];
    if (slot) play(slot, dur * 1.55, 0.11);
    setTimeout(stepDemo, Math.max(180, dur * 1000));
  }

  function mulberry(seed) {
    return function () {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  }

  function buildWorld(w, h) {
    if (builtW === w && buildings.length) return;
    builtW = w;
    var rand = mulberry(97);
    buildings = [];
    stars = [];
    rain = [];
    var x = -20;
    while (x < w + 30) {
      var bw = 36 + rand() * 78;
      var bh = h * (0.16 + rand() * 0.26);
      var wins = [];
      var cols = Math.max(2, Math.floor(bw / 14));
      var rows = Math.max(3, Math.floor(bh / 18));
      for (var c = 0; c < cols; c++) {
        for (var r = 0; r < rows; r++) {
          if (rand() > 0.42) {
            wins.push({
              c: c, r: r, cols: cols, rows: rows,
              on: rand() > 0.35,
              warm: rand() > 0.55
            });
          }
        }
      }
      buildings.push({
        x: x, w: bw, h: bh,
        wins: wins,
        sign: rand() > 0.72,
        hue: rand() > 0.5 ? "61,255,242" : "255,43,214"
      });
      x += bw + 8 + rand() * 18;
    }
    for (var i = 0; i < 70; i++) {
      stars.push({
        x: rand() * w,
        y: rand() * h * 0.42,
        r: rand() * 1.4 + 0.3,
        a: 0.25 + rand() * 0.7,
        p: rand() * Math.PI * 2
      });
    }
    for (var d = 0; d < 90; d++) {
      rain.push({
        x: rand() * w,
        y: rand() * h,
        l: 10 + rand() * 16,
        s: 3.2 + rand() * 4.5,
        o: 0.08 + rand() * 0.18
      });
    }
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, window.innerWidth) * dpr;
    canvas.height = Math.max(1, window.innerHeight) * dpr;
    gfx.setTransform(dpr, 0, 0, dpr, 0, 0);
    placeBlacks();
  }

  function draw(ts) {
    var w = window.innerWidth;
    var h = window.innerHeight;
    buildWorld(w, h);
    energy *= 0.985;
    document.documentElement.style.setProperty("--energy", energy.toFixed(3));

    var sky = gfx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#090112");
    sky.addColorStop(0.42, "#160824");
    sky.addColorStop(0.68, "#241033");
    sky.addColorStop(1, "#050108");
    gfx.fillStyle = sky;
    gfx.fillRect(0, 0, w, h);

    var mx = w * 0.78;
    var my = h * 0.15;
    var mr = Math.min(w, h) * 0.055;
    var moon = gfx.createRadialGradient(mx, my, mr * 0.2, mx, my, mr * 5.2);
    moon.addColorStop(0, "rgba(255, 236, 255, 0.95)");
    moon.addColorStop(0.12, "rgba(255, 170, 240, 0.45)");
    moon.addColorStop(0.28, "rgba(255, 43, 214, 0.16)");
    moon.addColorStop(1, "rgba(0,0,0,0)");
    gfx.fillStyle = moon;
    gfx.beginPath();
    gfx.arc(mx, my, mr * 5.2, 0, Math.PI * 2);
    gfx.fill();
    gfx.fillStyle = "#ffeefe";
    gfx.beginPath();
    gfx.arc(mx, my, mr, 0, Math.PI * 2);
    gfx.fill();

    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      var tw = 0.55 + Math.sin(ts * 0.002 + st.p) * 0.45;
      gfx.fillStyle = "rgba(230, 245, 255, " + (st.a * tw) + ")";
      gfx.beginPath();
      gfx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      gfx.fill();
    }

    for (var b = 0; b < 3; b++) {
      var bx = w * (0.18 + b * 0.26) + Math.sin(ts * 0.00035 + b) * 26;
      var beam = gfx.createLinearGradient(bx, 0, bx, h * 0.78);
      var alpha = 0.035 + energy * 0.05;
      beam.addColorStop(0, "rgba(180,255,250,0)");
      beam.addColorStop(0.45, "rgba(170,90,255," + alpha + ")");
      beam.addColorStop(1, "rgba(0,0,0,0)");
      gfx.fillStyle = beam;
      gfx.fillRect(bx - 46, 0, 92, h * 0.8);
    }

    var base = h * 0.78;
    buildings.forEach(function (bld) {
      gfx.fillStyle = "#0b0614";
      gfx.fillRect(bld.x, base - bld.h, bld.w, bld.h);
      gfx.strokeStyle = "rgba(" + bld.hue + ",0.25)";
      gfx.strokeRect(bld.x + 0.5, base - bld.h + 0.5, bld.w - 1, bld.h);
      bld.wins.forEach(function (win) {
        if (Math.random() < 0.004) win.on = !win.on;
        if (!win.on) return;
        var ww = (bld.w - 10) / win.cols;
        var hh = (bld.h - 12) / win.rows;
        gfx.fillStyle = win.warm ? "rgba(255, 196, 120, 0.72)" : "rgba(120, 230, 255, 0.55)";
        gfx.fillRect(bld.x + 6 + win.c * ww, base - bld.h + 8 + win.r * hh, Math.max(2, ww * 0.45), Math.max(2, hh * 0.42));
      });
      if (bld.sign) {
        var sy = base - bld.h + 16;
        gfx.shadowColor = "rgb(" + bld.hue + ")";
        gfx.shadowBlur = 12 + energy * 10;
        gfx.fillStyle = "rgba(" + bld.hue + ",0.9)";
        gfx.fillRect(bld.x + 8, sy, bld.w * 0.55, 6);
        gfx.shadowBlur = 0;
      }
    });

    gfx.save();
    gfx.globalAlpha = 0.18;
    gfx.translate(0, base + 8);
    gfx.scale(1, -0.35);
    buildings.forEach(function (bld) {
      gfx.fillStyle = "rgba(" + bld.hue + ",0.35)";
      gfx.fillRect(bld.x, -8, bld.w, bld.h);
    });
    gfx.restore();

    var floor = gfx.createLinearGradient(0, base, 0, h);
    floor.addColorStop(0, "rgba(8, 2, 16, 0)");
    floor.addColorStop(0.2, "rgba(18, 6, 28, 0.55)");
    floor.addColorStop(1, "rgba(4, 0, 10, 0.92)");
    gfx.fillStyle = floor;
    gfx.fillRect(0, base, w, h - base);

    var pool = gfx.createRadialGradient(w / 2, h * 0.86, 20, w / 2, h * 0.9, w * 0.42);
    pool.addColorStop(0, "rgba(61,255,242," + (0.05 + energy * 0.18) + ")");
    pool.addColorStop(0.45, "rgba(255,43,214," + (0.04 + energy * 0.1) + ")");
    pool.addColorStop(1, "rgba(0,0,0,0)");
    gfx.fillStyle = pool;
    gfx.fillRect(0, h * 0.55, w, h * 0.45);

    rain.forEach(function (drop) {
      drop.y += drop.s;
      drop.x += 0.4;
      if (drop.y > h) {
        drop.y = -20;
        drop.x = Math.random() * w;
      }
      gfx.strokeStyle = "rgba(190, 230, 255, " + drop.o + ")";
      gfx.lineWidth = 1;
      gfx.beginPath();
      gfx.moveTo(drop.x, drop.y);
      gfx.lineTo(drop.x - 1.5, drop.y + drop.l);
      gfx.stroke();
    });

    for (var i = motes.length - 1; i >= 0; i--) {
      var mote = motes[i];
      mote.x += mote.vx;
      mote.y += mote.vy;
      mote.life -= 0.012;
      if (mote.life <= 0) {
        motes.splice(i, 1);
        continue;
      }
      gfx.fillStyle = "hsla(" + mote.hue + ", 100%, 68%, " + (mote.life * 0.85) + ")";
      gfx.shadowColor = "hsl(" + mote.hue + ", 100%, 60%)";
      gfx.shadowBlur = 8;
      gfx.beginPath();
      gfx.arc(mote.x, mote.y, mote.s * mote.life, 0, Math.PI * 2);
      gfx.fill();
      gfx.shadowBlur = 0;
    }

    var vig = gfx.createRadialGradient(w / 2, h / 2, h * 0.2, w / 2, h / 2, h * 0.72);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(1, "rgba(0,0,0,0.45)");
    gfx.fillStyle = vig;
    gfx.fillRect(0, 0, w, h);

    requestAnimationFrame(draw);
  }

  window.addEventListener("pointerup", function () { pointerDown = false; });
  window.addEventListener("pointercancel", function () { pointerDown = false; });
  window.addEventListener("resize", resize);
  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    var midi = KEYMAP[e.key.toLowerCase()];
    if (!midi || !keyByMidi[midi]) return;
    e.preventDefault();
    userPlay(midi);
  });

  resize();
  requestAnimationFrame(function () {
    placeBlacks();
    requestAnimationFrame(draw);
  });
  setTimeout(stepDemo, 680);
})();
</script>
</body>
</html>
