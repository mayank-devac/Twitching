<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>After Hours — Neon Piano</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#080b19;color:#eef0ff;font-family:Arial,Helvetica,sans-serif}.scene{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 75% 48%,#19244544,transparent 48%),radial-gradient(ellipse at 18% 36%,#581d6333,transparent 40%),linear-gradient(#090b19,#0c1021 72%,#090b18)}.noise{position:absolute;inset:0;opacity:.06;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.8' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}.topline{position:absolute;top:4.7%;left:6%;right:6%;display:flex;justify-content:space-between;align-items:center;color:#868ba5;font-size:10px;letter-spacing:2.8px}.brand{display:flex;gap:12px;align-items:center;color:#dadce9}.brand svg{width:22px;height:22px}.live{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:2px}.live i{width:5px;height:5px;background:#9effdf;border-radius:50%;box-shadow:0 0 9px #86f9d8;animation:breathe 3s infinite}.heading{position:absolute;left:0;right:0;top:13.8%;text-align:center}.eyebrow{color:#baa0ca;font-size:10px;letter-spacing:5px;margin-bottom:21px}.heading h1{font-weight:400;font-size:clamp(46px,7.8vw,82px);letter-spacing:-4px;margin:0;line-height:1.1;background:linear-gradient(115deg,#fff 20%,#e0d5f1 55%,#9fa8c9);color:transparent;background-clip:text}.heading p{font-size:13px;letter-spacing:1px;color:#9295ad;margin-top:20px}.orbit{position:absolute;left:50%;top:44%;width:690px;height:290px;border:1px solid #a197df13;border-radius:50%;transform:translate(-50%,-50%) rotate(-12deg);box-shadow:0 0 80px #5c46bd08}.orbit:before{content:'';position:absolute;inset:32px -40px;border:1px solid #b187e010;border-radius:50%;transform:rotate(20deg)}.orb{position:absolute;top:37%;left:50%;width:137px;height:137px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 33% 26%,#f9dcff 0,#c897e7 7%,#8065b4 27%,#383862 52%,#10192f 74%);box-shadow:inset -12px -13px 25px #071021aa,inset 0 0 4px #e5bfff88,0 0 80px #b855ff18,0 0 140px #997af717;animation:float 7s ease-in-out infinite}.orb:after{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(0deg,transparent 0 5px,#05092011 6px 7px);box-shadow:inset 2px 1px 10px #e8bef93b}.starfield{position:absolute;inset:0;pointer-events:none}.star{position:absolute;border-radius:50%;background:#dcd1f5;box-shadow:0 0 8px #ad9ced;animation:twinkle 5s infinite alternate}.wave{position:absolute;top:50%;left:0;right:0;height:90px;opacity:.48}.wave svg{width:100%;height:100%;overflow:visible}.wave path{fill:none;stroke-width:1}.piano-area{position:absolute;top:58%;left:6%;right:6%;height:24%;perspective:1100px}.halo{position:absolute;inset:5% -5% -30%;background:radial-gradient(ellipse,#8b36bf20,transparent 65%);filter:blur(20px)}.piano{position:relative;width:100%;height:100%;padding:23px 17px 18px;border:1px solid #62637855;border-radius:13px;background:linear-gradient(155deg,#36364b,#191b2d 25%,#151829 65%,#242337);box-shadow:0 22px 50px #0009,0 4px 0 #10121d,0 5px 0 #53506766,inset 0 1px 1px #af9bcb44;transform:rotateX(16deg);transform-origin:center top}.piano:before{content:'';position:absolute;left:19px;right:19px;top:11px;height:1px;background:linear-gradient(90deg,transparent,#ec96de66,#94f4ed55,transparent)}.keyboard{position:relative;display:flex;height:100%;gap:5px;padding:0 1px}.key{border:0;cursor:pointer;touch-action:manipulation;transition:background .16s,box-shadow .16s,transform .16s;-webkit-tap-highlight-color:transparent;outline:none}.white{position:relative;flex:1;background:linear-gradient(90deg,#b9b7c9,#eeedf2 23%,#e8e7ef 75%,#c8c8d5);border-radius:3px 3px 5px 5px;box-shadow:inset 0 -7px 0 #b5b4c5,inset 0 -8px 0 #e7e3f3,0 3px 3px #000a;color:#838294;display:flex;align-items:flex-end;justify-content:center;padding:0 0 20px;font-size:9px;letter-spacing:.5px}.white:after{content:'';position:absolute;left:5px;right:5px;bottom:9px;height:1px;background:#ffffff88}.black{position:absolute;top:-1px;width:4.5%;height:62%;z-index:2;border-radius:0 0 5px 5px;background:linear-gradient(90deg,#101221,#323245 32%,#27283a 65%,#0e1120);box-shadow:inset 0 -9px 0 #101221,inset 0 -10px 1px #60607944,0 5px 5px #0008;border:1px solid #10121a}.white.active{background:linear-gradient(135deg,#fff0ff,var(--glow));box-shadow:inset 0 -6px 0 #fff3,0 0 22px var(--glow),0 0 50px color-mix(in srgb,var(--glow) 40%,transparent);transform:translateY(3px);color:#45354f}.black.active{background:linear-gradient(#726283,var(--glow));box-shadow:inset 0 -7px 0 #301c4855,0 0 24px var(--glow);transform:translateY(2px)}.key:focus-visible{outline:2px solid #eab9f8;outline-offset:3px}.reflection{position:absolute;left:8%;right:8%;top:83%;height:9%;opacity:.14;filter:blur(13px);background:linear-gradient(90deg,transparent,#ee86de 15%,#e181df 35%,#879af0 58%,#87f2e8 81%,transparent);transform:perspective(300px) rotateX(50deg);mask-image:linear-gradient(#000,transparent)}.under{position:absolute;left:6%;right:6%;top:85%;display:flex;justify-content:space-between;align-items:center;color:#777e9c;font-size:10px;letter-spacing:1.5px}.under .instruction{color:#b5b2c9;letter-spacing:.5px;display:flex;gap:10px;align-items:center}.instruction svg{width:15px;height:15px;stroke:#bca2d2;fill:none;stroke-width:1.2}.footer{position:absolute;bottom:4%;left:6%;right:6%;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #b1a8dc13;padding-top:18px;font-size:9px;letter-spacing:2px;color:#5e647e}.footer .notes{display:flex;gap:5px;align-items:center}.notes span{height:11px;width:2px;background:#85809966;animation:equalize 1.5s ease-in-out infinite}.notes span:nth-child(2){animation-delay:-.5s}.notes span:nth-child(3){animation-delay:-.9s}.notes span:nth-child(4){animation-delay:-.2s}.notes span:nth-child(5){animation-delay:-.7s}.ripple{position:absolute;pointer-events:none;bottom:18%;width:3px;height:3px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow);animation:rise 2.5s ease-out forwards}@keyframes rise{to{transform:translate(var(--drift),-180px);opacity:0}}@keyframes float{50%{transform:translate(-50%,-9px)}}@keyframes twinkle{to{opacity:.15;transform:scale(.6)}}@keyframes breathe{50%{opacity:.4}}@keyframes equalize{50%{height:4px;opacity:.3}}@media(max-width:600px){.heading h1{letter-spacing:-2px}.piano-area{left:4%;right:4%;height:21%;top:60%}.piano{padding:18px 9px 13px}.keyboard{gap:3px}.white{font-size:7px;padding-bottom:15px}.orb{width:110px;height:110px}.orbit{width:490px;height:250px}.under{top:85%;font-size:8px}.topline{font-size:8px;letter-spacing:2px}.heading p{font-size:11px}.footer{font-size:7px;letter-spacing:1.5px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.ripple{display:none}}
</style>
</head>
<body>
<main class="scene">
<div class="noise"></div><div class="starfield" aria-hidden="true"></div>
<header class="topline"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 17V7m4 13V4m4 14V6m4 14V4m4 13V7"/></svg> NOCTURNE</div><div class="live"><i></i> AN INTERACTIVE SOUNDSPACE</div></header>
<div class="heading"><div class="eyebrow">LET THE NIGHT PLAY</div><h1>After hours.</h1><p>A little light. A little sound. A moment of your own.</p></div>
<div class="orbit" aria-hidden="true"></div><div class="orb" aria-hidden="true"></div>
<div class="wave" aria-hidden="true"><svg viewBox="0 0 960 90" preserveAspectRatio="none"><defs><linearGradient id="w"><stop stop-color="#d579e2" stop-opacity="0"/><stop offset=".3" stop-color="#d579e2"/><stop offset=".7" stop-color="#8eadeb"/><stop offset="1" stop-color="#8ce6e6" stop-opacity="0"/></linearGradient></defs><path id="wave1" stroke="url(#w)"/><path id="wave2" stroke="url(#w)" opacity=".4"/><path id="wave3" stroke="url(#w)" opacity=".2"/></svg></div>
<div class="piano-area"><div class="halo"></div><div class="piano"><div class="keyboard" aria-label="Interactive piano keyboard"></div></div></div>
<div class="reflection" aria-hidden="true"></div>
<div class="under"><span class="instruction"><svg viewBox="0 0 20 20"><path d="M5 8v4l3 2V6L5 8H2v4h3m7-6q6 4 0 8m-2-6q3 2 0 4"/></svg><span id="hint">Touch a key. Find your melody.</span></span><span>21 KEYS &nbsp; · &nbsp; ENDLESS POSSIBILITIES</span></div>
<footer class="footer"><span>MADE FOR THE QUIET MOMENTS</span><span class="notes" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span><span>HEADPHONES ENCOURAGED</span></footer>
</main>
<script>
(()=>{
const scene=document.querySelector('.scene'),keyboard=document.querySelector('.keyboard'),stars=document.querySelector('.starfield');
let seed=43;function random(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
for(let i=0;i<54;i++){const s=document.createElement('i');s.className='star';s.style.cssText=`left:${5+random()*90}%;top:${9+random()*47}%;width:${random()*1.7+.7}px;height:${random()*1.7+.7}px;opacity:${random()*.6+.1};animation-delay:-${random()*7}s`;stars.appendChild(s)}
const whites=[48,50,52,53,55,57,59,60,62,64,65,67,69,71],names=['C','D','E','F','G','A','B'],keys=new Map(),colors=['#f099d5','#e596e0','#c59bef','#ac9ff4','#92b8f3','#88d7e6','#94eadb'];
function makeKey(note,index,black){const b=document.createElement('button');b.className='key '+(black?'black':'white');b.style.setProperty('--glow',colors[Math.floor(index/2)%colors.length]);b.setAttribute('aria-label',`${names[index%7]}${black?' sharp':''} ${Math.floor(note/12)-1}`);if(black)b.style.left=`${(index+1)/14*100-2.25}%`;else b.textContent=names[index%7]+(index%7===0?Math.floor(note/12)-1:'');b.addEventListener('pointerdown',()=>{engaged=true;document.getElementById('hint').textContent='Follow the glow. Make it yours.';play(note,true)});keyboard.appendChild(b);keys.set(note,b)}
whites.forEach((n,i)=>makeKey(n,i,false));whites.forEach((n,i)=>{if(i<13&&whites[i+1]-n===2)makeKey(n+1,i,true)});
let ctx,engaged=false,energy=0;function sound(note){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime,f=440*Math.pow(2,(note-69)/12),out=ctx.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.17,t+.008);out.gain.exponentialRampToValueAtTime(.055,t+.2);out.gain.exponentialRampToValueAtTime(.001,t+2.3);out.connect(ctx.destination);[1,2,3].forEach((m,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f*m;g.gain.value=[.75,.17,.05][i];o.connect(g);g.connect(out);o.start(t);o.stop(t+2.4)});setTimeout(()=>out.disconnect(),2500)}catch(e){}}
function play(note,audible){const k=keys.get(note);if(!k)return;k.classList.add('active');clearTimeout(k.release);k.release=setTimeout(()=>k.classList.remove('active'),650);energy=1;if(audible)sound(note);for(let i=0;i<5;i++){const p=document.createElement('i');p.className='ripple';p.style.cssText=`left:${6+(note-48)/24*88+random()*3}%;--glow:${k.style.getPropertyValue('--glow')};--drift:${(random()-.5)*75}px;animation-delay:${i*.05}s`;scene.appendChild(p);setTimeout(()=>p.remove(),2900)}}
const demo=[60,64,67,71,69,67,64,62,60,55,59,62,64,67,64,60];demo.forEach((n,i)=>setTimeout(()=>{if(!engaged)play(n,false)},1100+i*440));
const mapping='asdfghjkl;';document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const i=mapping.indexOf(e.key.toLowerCase());if(i>=0){engaged=true;play(whites[i+2],true)}});
let prev=0;function animate(t){if(t-prev>32){prev=t;energy*=.94;for(let j=0;j<3;j++){let d='';for(let x=0;x<=960;x+=8){const envelope=Math.pow(Math.sin(x/960*Math.PI),3),y=45+Math.sin(x*.013+t*.0006+j*.6)*envelope*(9+energy*22)+Math.sin(x*.025-t*.0004+j)*envelope*6;d+=(x?'L':'M')+x+' '+y.toFixed(2)}document.getElementById('wave'+(j+1)).setAttribute('d',d)}}requestAnimationFrame(animate)}requestAnimationFrame(animate);
})();
</script>
</body>
</html>
