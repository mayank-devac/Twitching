<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Quiet Reef — Living Aquarium</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#101e22;color:#d5e4df;font-family:Arial,Helvetica,sans-serif}.aquarium{position:relative;width:100%;height:100%;isolation:isolate;background:#061f25}canvas{display:block;width:100%;height:100%;cursor:crosshair}.masthead{position:absolute;z-index:2;top:5.1%;left:6.4%;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:3.8px;color:#98b9b2;display:flex;align-items:center;gap:11px}.eyebrow:before{content:"";height:1px;width:26px;background:#86a89f}h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(32px,5.4vw,57px);letter-spacing:-1.8px;margin:15px 0 11px;color:#e5eee1}h1 em{font-weight:400;color:#a7c6b6}.subtitle{font-size:11px;letter-spacing:1px;color:#8dafaa;line-height:1.8}.status{position:absolute;right:6.4%;top:5.4%;font-size:10px;letter-spacing:2px;color:#a1bdb4;pointer-events:none;display:flex;align-items:center;gap:8px}.dot{width:5px;height:5px;background:#aacd9b;border-radius:50%;box-shadow:0 0 10px #afdb9f75}.feed-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:19.4%;display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:1.4px;color:#d1dfc7;pointer-events:none;white-space:nowrap;text-shadow:0 2px 10px #001717}.feed-hint svg{width:17px;height:17px;opacity:.65}.stand{position:absolute;bottom:0;left:0;width:100%;height:13.8%;background:linear-gradient(90deg,#1a2525,#29312d 47%,#192323);border-top:8px solid #172625;box-shadow:0 -5px 0 #081a1b,0 -7px 0 #57615955;pointer-events:none}.stand:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0,transparent 4px,#9c9b6e05 5px,#00000008 6px);box-shadow:inset 0 12px 20px #0005}.stand-line{position:absolute;left:50%;height:78%;top:8%;width:1px;background:#080f1060;box-shadow:1px 0 #6b6f5630}.stand-handle{position:absolute;top:24%;left:calc(50% - 18px);width:8px;height:30px;border-radius:3px;background:linear-gradient(90deg,#4b5548,#9da588,#4d584a);box-shadow:0 2px 4px #0007}.stand-handle.right{left:calc(50% + 11px)}.plaque{position:absolute;left:6.5%;bottom:25%;font-size:9px;letter-spacing:2.5px;color:#a7ad93}.plaque span{display:block;font-family:Georgia,serif;font-size:13px;color:#d0cfb9;letter-spacing:1px;margin-top:7px}.details{position:absolute;bottom:29%;right:6.5%;font-size:9px;letter-spacing:1.6px;color:#9ea991}.details b{font-weight:400;color:#d1d3bb;margin-left:15px}.edge{position:absolute;inset:0 0 13.8%;pointer-events:none;box-shadow:inset 0 0 75px #00191c66,inset 3px 0 0 #a3c8bf16,inset -3px 0 0 #a3c8bf16;border-top:1px solid #6d9c9133}.soundless{position:absolute;bottom:15.3%;left:6.5%;font-size:8px;letter-spacing:2px;color:#b5c6b280;pointer-events:none}.water-label{position:absolute;right:6.5%;bottom:15.3%;font-size:8px;letter-spacing:1.7px;color:#b5c6b280;pointer-events:none}@media(max-width:550px){.status{font-size:8px;top:4.2%}.masthead{top:7%}h1{font-size:38px}.subtitle{font-size:9px}.plaque{font-size:7px}.details{font-size:7px}.feed-hint{font-size:8px}}
</style>
</head>
<body>
<main class="aquarium" aria-label="An animated planted aquarium. Click the water to feed the fish.">
<canvas id="tank"></canvas>
<div class="masthead"><div class="eyebrow">A LITTLE WORLD, ALIVE</div><h1>The quiet <em>reef.</em></h1><div class="subtitle">Slow down. There’s a whole world in here.</div></div>
<div class="status"><span class="dot"></span>LIVE AQUARIUM</div>
<div class="feed-hint" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M9 12V5a2 2 0 0 1 4 0v6l2-1 5 3-2 7H9l-5-7a2 2 0 0 1 3-2l2 2"/><path d="M3 4h3M17 4h3M5 1l2 2M16 1l-2 2"/></svg>TOUCH THE WATER TO FEED</div>
<div class="soundless">EST. 2024 · A LIVING STILL LIFE</div><div class="water-label">FRESHWATER / 240 L</div>
<div class="edge"></div>
<div class="stand"><div class="stand-line"></div><div class="stand-handle"></div><div class="stand-handle right"></div><div class="plaque">THE QUIET COLLECTION<span>No. 008 — River Garden</span></div><div class="details">WATER <b>24°C</b><br><br>LIGHT <b>DAYLIGHT</b></div></div>
</main>
<script>
(()=>{
const canvas=document.getElementById('tank'),ctx=canvas.getContext('2d');let W,H,D,ground,waterH;let seed=214;const random=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};const range=(a,b)=>a+random()*(b-a);let stones=[],plants=[],pebbles=[],dust=[],bubbles=[],fish=[],food=[],ripples=[];let last=0,time=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);waterH=H*.862;ground=H*.798;seed=214;pebbles=[];plants=[];stones=[];dust=[];bubbles=[];fish=[];
for(let i=0;i<2100;i++)pebbles.push({x:range(0,W),y:range(ground-12,waterH+10),r:range(1,6)*W/960,c:Math.floor(range(0,7)),s:range(.5,1.4)});
for(let i=0;i<100;i++)dust.push({x:range(0,W),y:range(0,ground),r:range(.4,1.7),v:range(2,9),a:range(.06,.3)});
for(let i=0;i<24;i++)bubbles.push({x:W*.88+range(-W*.02,W*.015),y:range(H*.2,ground),r:range(1.3,4),v:range(18,39),phase:range(0,6.28)});
const positions=[[.08,.15,16],[.15,.21,18],[.23,.12,12],[.35,.075,9],[.68,.10,12],[.76,.16,15],[.86,.23,22],[.94,.17,15],[.58,.07,9]];
positions.forEach(([x,h,n],index)=>{for(let i=0;i<n;i++)plants.push({x:W*x+range(-W*.035,W*.035),y:ground+range(-3,12),h:H*h*range(.55,1.15),lean:range(-.6,.6),phase:range(0,6.28),width:range(3,8)*W/960,kind:index%3,hue:range(100,150)});});
[[.18,.035,.042],[.27,.066,.065],[.32,.046,.044],[.70,.083,.09],[.79,.055,.058],[.84,.033,.04],[.49,.019,.022]].forEach(([x,w,h])=>{let pts=[];for(let i=0;i<12;i++){let a=i/12*Math.PI*2;pts.push({x:Math.cos(a)*W*w*range(.85,1.14),y:Math.sin(a)*H*h*range(.85,1.12)})}let flecks=[];for(let i=0;i<130;i++)flecks.push({x:range(-W*w,W*w),y:range(-H*h,H*h),r:range(.3,2.3),a:range(.03,.18)});stones.push({x:W*x,y:ground-H*h*.47,w:W*w,h:H*h,pts,flecks});});
const specs=[['angel',.56,.37,74,1],['angel',.67,.43,54,-1],['gold',.31,.47,60,1],['gold',.81,.61,44,-1],['gold',.11,.61,36,1],['tetra',.38,.33,28,1],['tetra',.44,.37,25,1],['tetra',.29,.38,25,1],['tetra',.22,.34,24,1],['tetra',.51,.57,28,-1],['tetra',.58,.60,24,-1],['tetra',.64,.57,26,-1],['stripe',.40,.66,39,-1],['stripe',.19,.52,32,1],['stripe',.84,.35,31,-1]];
specs.forEach(([type,x,y,s,dir],i)=>fish.push({type,x:W*x,y:H*y,size:s*W/960,dir,speed:range(13,26)*W/960,phase:range(0,6.28),base:H*y,depth:range(.7,1),vx:dir*20,vy:0,id:i,turn:dir}));}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function background(){let g=ctx.createLinearGradient(0,0,0,waterH);g.addColorStop(0,'#153e43');g.addColorStop(.2,'#124048');g.addColorStop(.52,'#0b4248');g.addColorStop(1,'#123c39');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<7;i++){let x=W*(.06+i*.17)+Math.sin(time*.08+i)*W*.025;let g=ctx.createLinearGradient(x,0,x+W*.13,ground);g.addColorStop(0,'#bcdbc413');g.addColorStop(.65,'#a5d3b307');g.addColorStop(1,'#abd0ad00');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-W*.03,0);ctx.lineTo(x+W*.03,0);ctx.lineTo(x+W*.34,ground);ctx.lineTo(x+W*.10,ground);ctx.fill()}ctx.restore();
let glow=ctx.createRadialGradient(W*.55,H*.48,0,W*.55,H*.48,W*.64);glow.addColorStop(0,'#7fc8a00e');glow.addColorStop(1,'#001b222c');ctx.fillStyle=glow;ctx.fillRect(0,0,W,waterH);
ctx.strokeStyle='#c4e2cd0b';ctx.lineWidth=1;for(let i=0;i<13;i++){ctx.beginPath();for(let x=0;x<=W;x+=20){let y=H*.015+i*4+Math.sin(x*.019+time*.3+i)*3;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
}
function drawPlant(p,back){let sway=Math.sin(time*.7+p.phase)*p.h*.055;let tipX=p.x+p.lean*p.h*.34+sway;let tipY=p.y-p.h;let g=ctx.createLinearGradient(p.x,p.y,tipX,tipY);g.addColorStop(0,`hsla(${p.hue},35%,15%,.95)`);g.addColorStop(.6,`hsla(${p.hue},35%,${back?26:35}%,.95)`);g.addColorStop(1,`hsla(${p.hue-12},40%,${back?33:48}%,.85)`);ctx.fillStyle=g;ctx.strokeStyle=g;if(p.kind===0){ctx.beginPath();ctx.moveTo(p.x-p.width*.5,p.y);ctx.bezierCurveTo(p.x-p.width,p.y-p.h*.4,tipX-p.width*2,tipY+p.h*.3,tipX,tipY);ctx.bezierCurveTo(tipX+p.width*2,tipY+p.h*.25,p.x+p.width*1.4,p.y-p.h*.4,p.x+p.width*.5,p.y);ctx.fill();ctx.strokeStyle='#b5d08828';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x+sway,p.y-p.h*.5,tipX,tipY);ctx.stroke()}else{ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x+sway,tipY+p.h*.4,tipX,tipY);ctx.stroke();for(let j=1;j<9;j++){let u=j/9;let x=p.x+(tipX-p.x)*u*u,y=p.y-p.h*u;let len=p.width*(p.kind===1?3.3:2.3)*(1-u*.7);for(let side of [-1,1]){ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+side*len*.6,y+len*.25,x+side*len*1.2,y-len*.45,x+side*len,y-len*.85);ctx.bezierCurveTo(x+side*len*.3,y-len*.8,x,y-len*.3,x,y);ctx.fill()}}}}
function drawRock(r){ctx.save();ctx.translate(r.x,r.y);ellipse(0,r.h*.58,r.w*1.1,r.h*.24,'#001b1aa0');ctx.beginPath();r.pts.forEach((p,i)=>{if(!i)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.closePath();let g=ctx.createLinearGradient(-r.w,-r.h,r.w,r.h);g.addColorStop(0,'#798878');g.addColorStop(.35,'#5b6d63');g.addColorStop(.65,'#3b514b');g.addColorStop(1,'#263d38');ctx.fillStyle=g;ctx.fill();ctx.save();ctx.clip();for(let f of r.flecks)ellipse(f.x,f.y,f.r,f.r*.65,`rgba(204,215,185,${f.a})`);ctx.strokeStyle='#1b332d66';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-r.w*.2,-r.h);ctx.lineTo(-r.w*.1,-r.h*.4);ctx.lineTo(r.w*.2,-r.h*.1);ctx.lineTo(r.w*.5,r.h);ctx.stroke();let moss=ctx.createLinearGradient(0,-r.h,0,0);moss.addColorStop(0,'#7c91504a');moss.addColorStop(1,'#6e8a3700');ctx.fillStyle=moss;ctx.fillRect(-r.w,-r.h,r.w*2,r.h);ctx.restore();ctx.restore()}
function floor(){let g=ctx.createLinearGradient(0,ground-8,0,waterH);g.addColorStop(0,'#73745a');g.addColorStop(.2,'#787662');g.addColorStop(1,'#3f4940');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,ground);for(let x=0;x<=W;x+=20)ctx.lineTo(x,ground+Math.sin(x*.015)*4+Math.cos(x*.036)*2);ctx.lineTo(W,waterH);ctx.lineTo(0,waterH);ctx.fill();const colors=['#797967','#9b9881','#59675e','#b3ac91','#526058','#777d6a','#c4b79b'];for(let p of pebbles){ellipse(p.x+1,p.y+1,p.r,p.r*p.s,'#1b302947');ellipse(p.x,p.y,p.r,p.r*p.s,colors[p.c]);if(p.r>3)ellipse(p.x-p.r*.23,p.y-p.r*.22,p.r*.4,p.r*.19,'#d4ccb431')}
}
function drawFish(f){let s=f.size,ang=Math.atan2(f.vy,Math.abs(f.vx))*.3;ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.turn,1);ctx.rotate(ang);let wag=Math.sin(time*6+f.phase),type=f.type;ctx.globalAlpha=f.depth;const angel=type==='angel';let ry=angel?s*.49:s*.225;const palettes=type==='gold'?['#f6da8b','#eaa651','#ad572b']:type==='tetra'?['#9abeb0','#72bdb8','#234d51']:type==='stripe'?['#d7cb92','#8c9a76','#455d4e']:['#e0d6b0','#aeb9a4','#657f76'];
// translucent tail and fins
ctx.fillStyle=type==='gold'?'#d8a652a0':type==='tetra'?'#a1cacd68':'#b9c9ac70';ctx.strokeStyle=type==='gold'?'#f1ca8470':'#c5d3b85a';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(-s*.36,0);ctx.quadraticCurveTo(-s*.64,-ry*.4,-s*.83, -ry*.95+wag*3);ctx.quadraticCurveTo(-s*.70,0,-s*.83,ry*.95+wag*3);ctx.quadraticCurveTo(-s*.54,ry*.4,-s*.36,0);ctx.fill();ctx.stroke();for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-s*.38,0);ctx.lineTo(-s*.78,(-.8+i*.4)*ry+wag*3);ctx.stroke()}
ctx.beginPath();ctx.moveTo(-s*.24,-ry*.7);ctx.quadraticCurveTo(-s*.14,-ry*(angel?2.15:1.65),s*.06,-ry*(angel?2:1.4));ctx.quadraticCurveTo(s*.24,-ry*1.2,s*.33,-ry*.45);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-s*.26,ry*.5);ctx.quadraticCurveTo(-s*.18,ry*(angel?1.9:1.6),s*.08,ry*(angel?1.8:1.25));ctx.lineTo(s*.27,ry*.6);ctx.fill();ctx.stroke();
let g=ctx.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,palettes[0]);g.addColorStop(.45,palettes[1]);g.addColorStop(1,palettes[2]);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(s*.51,0);ctx.bezierCurveTo(s*.38,-ry*.8,s*.14,-ry*1.1,-s*.07,-ry);ctx.bezierCurveTo(-s*.33,-ry*.9,-s*.43,-ry*.2,-s*.44,0);ctx.bezierCurveTo(-s*.38,ry*.55,-s*.1,ry*1.04,s*.12,ry*.87);ctx.bezierCurveTo(s*.34,ry*.65,s*.44,ry*.2,s*.51,0);ctx.fill();
ctx.save();ctx.clip();if(angel||type==='stripe'){ctx.fillStyle=angel?'#233d3baf':'#2b443c8a';for(let j=0;j<(angel?3:5);j++){let x=(-.24+j*(angel?.25:.14))*s;ctx.beginPath();ctx.moveTo(x,-ry*1.2);ctx.lineTo(x+s*.085,-ry*1.2);ctx.lineTo(x+s*.02,ry*1.2);ctx.lineTo(x-s*.055,ry*1.2);ctx.fill()}}if(type==='tetra'){ctx.fillStyle='#62e2df';ctx.shadowColor='#65dcdb';ctx.shadowBlur=5;ctx.fillRect(-s*.36,-ry*.25,s*.72,ry*.23);ctx.shadowBlur=0;ctx.fillStyle='#d65b44';ctx.fillRect(-s*.38,ry*.15,s*.48,ry*.48)}for(let j=0;j<6;j++){ctx.strokeStyle='#e4edca10';ctx.beginPath();ctx.ellipse(-s*.25+j*s*.1,0,s*.11,ry*.85,0,-1.4,1.4);ctx.stroke()}ctx.restore();
ctx.strokeStyle='#243f4160';ctx.beginPath();ctx.ellipse(s*.22,0,s*.095,ry*.75,.2,-1.1,1.4);ctx.stroke();ctx.fillStyle='#c0c7a066';ctx.beginPath();ctx.moveTo(s*.12,0);ctx.quadraticCurveTo(-s*.12,ry*.9+wag*2,-s*.03,ry*.15);ctx.fill();if(angel){ctx.strokeStyle='#d1d1ae90';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(s*.2,ry*.65);ctx.quadraticCurveTo(s*.17,ry*2,s*.01+wag*3,ry*2.55);ctx.moveTo(s*.12,ry*.7);ctx.quadraticCurveTo(s*.03,ry*1.7,-s*.06+wag*3,ry*2.3);ctx.stroke()}
ellipse(s*.345,-ry*.19,s*.061,s*.061,'#c5be8c');ellipse(s*.354,-ry*.19,s*.035,s*.042,'#0a2227');ellipse(s*.365,-ry*.215,s*.012,s*.012,'#ffffffbb');ctx.restore()}
function updateFish(f,dt){let target=null,min=Infinity;for(let p of food){let d=Math.hypot(p.x-f.x,p.y-f.y);if(d<min){min=d;target=p}}let desiredVx,desiredVy;if(target){let dx=target.x-f.x,dy=target.y-f.y,d=Math.max(1,Math.hypot(dx,dy));desiredVx=dx/d*f.speed*3;desiredVy=dy/d*f.speed*3;if(d<f.size*.33+5){target.eaten=true;for(let i=0;i<3;i++)dust.push({x:target.x,y:target.y,r:1,v:12,a:.4});}}else{if(f.x>W-f.size*.7)f.dir=-1;if(f.x<f.size*.7)f.dir=1;desiredVx=f.dir*f.speed;desiredVy=(f.base+Math.sin(time*.4+f.phase)*H*.032-f.y)*.25}f.vx+=(desiredVx-f.vx)*Math.min(1,dt*1.7);f.vy+=(desiredVy-f.vy)*Math.min(1,dt*1.4);f.x+=f.vx*dt;f.y+=f.vy*dt;f.y=Math.max(H*.21,Math.min(ground-f.size,f.y));let facing=f.vx<0?-1:1;f.turn+=(facing-f.turn)*Math.min(1,dt*4);if(Math.abs(f.turn)<.08)f.turn=.08*facing;}
function frame(now){let dt=Math.min((now-last)/1000||.016,.04);last=now;time+=dt*(reduced?.3:1);background();for(let p of plants)drawPlant(p,true);floor();for(let r of stones)drawRock(r);
// a weathered branch nestled in the river bed
ctx.save();ctx.strokeStyle='#283e33';ctx.lineCap='round';ctx.lineWidth=W*.014;ctx.beginPath();ctx.moveTo(W*.35,ground+9);ctx.bezierCurveTo(W*.42,ground-12,W*.52,ground-36,W*.58,ground-47);ctx.stroke();ctx.lineWidth=W*.006;ctx.beginPath();ctx.moveTo(W*.47,ground-19);ctx.quadraticCurveTo(W*.49,ground-58,W*.52,ground-76);ctx.stroke();ctx.strokeStyle='#7b765346';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.35,ground+4);ctx.quadraticCurveTo(W*.48,ground-27,W*.58,ground-49);ctx.stroke();ctx.restore();
for(let p of plants.filter((_,i)=>i%5===0))drawPlant(p,false);
for(let p of dust){p.y-=p.v*dt;p.x+=Math.sin(time*.3+p.y)*dt*2;if(p.y<0)p.y=ground;ellipse(p.x,p.y,p.r,p.r,`rgba(192,218,181,${p.a})`)}if(dust.length>150)dust.splice(100,dust.length-150);
for(let b of bubbles){b.y-=b.v*dt;if(b.y<H*.025)b.y=ground;let bx=b.x+Math.sin(time*1.5+b.phase+b.y*.01)*5;ctx.strokeStyle='#c0e2d23d';ctx.lineWidth=.7;ctx.beginPath();ctx.arc(bx,b.y,b.r,0,Math.PI*2);ctx.stroke();ellipse(bx-b.r*.3,b.y-b.r*.4,b.r*.22,b.r*.18,'#e2f4df66')}
food=food.filter(p=>!p.eaten&&p.y<ground);for(let p of food){p.y+=p.speed*dt;p.x+=Math.sin(time*2+p.phase)*dt*3;ellipse(p.x,p.y,2.1,1.7,'#dac38a');ellipse(p.x-.4,p.y-.5,.7,.5,'#f2dfb0')}
fish.forEach(f=>{updateFish(f,dt);drawFish(f)});for(let r of ripples){r.age+=dt;ctx.strokeStyle=`rgba(189,225,199,${Math.max(0,.32-r.age*.17)})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(r.x,r.y,9+r.age*36,3+r.age*12,0,0,Math.PI*2);ctx.stroke()}ripples=ripples.filter(r=>r.age<2);
let shade=ctx.createLinearGradient(0,ground-30,0,waterH);shade.addColorStop(0,'#001d1900');shade.addColorStop(1,'#00191466');ctx.fillStyle=shade;ctx.fillRect(0,ground-30,W,waterH-ground+30);requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{if(e.clientY>waterH)return;let x=Math.max(25,Math.min(W-25,e.clientX));let y=Math.max(H*.23,Math.min(ground-30,e.clientY));for(let i=0;i<8;i++)food.push({x:x+range(-18,18),y:y+range(-10,5),speed:range(9,16),phase:range(0,6.28)});food=food.slice(-64);ripples.push({x:e.clientX,y:e.clientY,age:0});document.getElementById('hint').innerHTML='A LITTLE TREAT. A LITTLE JOY.';setTimeout(()=>{document.getElementById('hint').textContent='TOUCH THE WATER TO FEED'},4000)});window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
