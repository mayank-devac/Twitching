<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>After Hours — Neon Piano</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:#080b17;color:#eef0ff}button{font:inherit}.scene{position:relative;width:100%;height:100%;isolation:isolate;background:radial-gradient(ellipse at 50% 51%,#1a1840 0%,#0d1023 38%,#080b16 75%)}#atmosphere{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.grain{position:absolute;inset:0;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}.topline{position:absolute;top:5.2%;left:7%;right:7%;display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:2.6px;color:#8989a9}.brand{display:flex;align-items:center;gap:10px;color:#d1d0e2;font-weight:bold}.brand svg{width:19px;height:19px}.live{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:1.8px}.live i{width:5px;height:5px;border-radius:50%;background:#a594fd;box-shadow:0 0 10px #a594fd}.title{position:absolute;top:15.3%;left:0;right:0;text-align:center}.eyebrow{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:#aa96e1;margin:0 0 20px}.title h1{font-size:clamp(46px,8.6vw,88px);font-weight:400;letter-spacing:-5px;margin:0;line-height:1.05;color:#f4efff;text-shadow:0 0 35px #b9a1f81a}.title h1 em{font-family:Georgia,'Times New Roman',serif;font-weight:400;color:#c9acff}.subtitle{font-size:12px;letter-spacing:1px;color:#858399;margin:22px 0 0}.halo{position:absolute;left:13%;top:32%;width:74%;height:41%;border-radius:50%;background:radial-gradient(ellipse,#9c4ffe15,transparent 70%);filter:blur(18px)}.orbit{position:absolute;width:69%;height:21%;left:15.5%;top:37%;border:1px solid #9b75d918;border-radius:50%;transform:rotate(-13deg)}.orbit:after{content:'';position:absolute;width:5px;height:5px;right:18%;top:7%;border-radius:50%;background:#c5a7ff;box-shadow:0 0 16px #ae77ff}.wave{position:absolute;left:24%;width:52%;top:37%;height:80px;opacity:.7}.instrument{position:absolute;left:8%;right:8%;top:47%;height:25%;max-height:270px;min-height:150px;perspective:900px}.piano{position:absolute;inset:0;transform:rotateX(17deg);transform-origin:center bottom;padding:17px 14px 18px;border-radius:17px;background:linear-gradient(160deg,#343046,#171727 26%,#101020 80%,#27233b);border:1px solid #75629466;box-shadow:0 1px 0 #c6a3ff55 inset,0 -4px 20px #9a65ff16,0 23px 35px #0009,0 3px 0 #110f21,0 10px 0 #242034,0 11px 0 #75618b55}.rail{position:absolute;left:18px;right:18px;top:6px;height:2px;background:linear-gradient(90deg,transparent,#9767ee,#67d3dc,#ac67ed,transparent);box-shadow:0 0 8px #a975ff}.keys{position:relative;display:flex;height:100%;gap:4px}.key{cursor:pointer;position:relative;border:0;outline:0;touch-action:manipulation;transition:background .14s,box-shadow .14s,transform .14s;user-select:none;-webkit-tap-highlight-color:transparent}.white{flex:1;height:100%;border-radius:4px 4px 7px 7px;background:linear-gradient(90deg,#bfc1d2,#edeaf4 28%,#d9d5e8 75%,#aba7c3);box-shadow:0 -8px 10px #33304715 inset,0 4px 0 #76738e,0 7px 5px #0006;color:#7b738e;padding:0}.white:before{content:'';position:absolute;inset:4px 6px 26%;border-radius:3px;background:linear-gradient(180deg,#fff5,transparent)}.white .note{position:absolute;bottom:24px;left:0;right:0;font-size:10px;letter-spacing:1px}.white .shortcut{position:absolute;bottom:9px;left:0;right:0;font-size:8px;opacity:.5}.black{position:absolute;z-index:3;top:-1px;width:4.45%;height:61%;border-radius:0 0 5px 5px;background:linear-gradient(90deg,#131320,#29263b 40%,#151424 85%);border:1px solid #494052;box-shadow:0 6px 0 #080910,2px 8px 7px #0008;color:#7e748f}.black:before{content:'';position:absolute;inset:4px 4px 10px;border-radius:2px;background:linear-gradient(180deg,#44405744,#18172500);border-bottom:1px solid #61557077}.black .shortcut{position:absolute;bottom:12px;left:0;right:0;font-size:8px}.white.active{background:linear-gradient(180deg,#eee0ff,#c4a0ff 65%,#ac7eff);box-shadow:0 0 22px #b078ffb3,0 0 3px #f2dfff inset,0 3px 0 #815bb1;transform:translateY(3px);color:#51346c}.white.cyan.active{background:linear-gradient(180deg,#d9fffa,#85e6ef 65%,#5dd4df);box-shadow:0 0 24px #4bdce8a0,0 0 3px #f2ffff inset,0 3px 0 #3d8f9a;color:#25606a}.black.active{background:linear-gradient(180deg,#5e3d81,#bd7cf3);box-shadow:0 0 24px #b975ff90,0 3px 0 #4f2d70;transform:translateY(3px)}.key:focus-visible{outline:2px solid #7bfff2;outline-offset:3px}.underlight{position:absolute;left:9%;right:9%;top:calc(72% + 15px);height:35px;border-radius:50%;background:#a272fc30;filter:blur(24px)}.feedback{position:absolute;top:77.5%;left:0;right:0;text-align:center;height:60px}.note-readout{font-family:Georgia,'Times New Roman',serif;font-size:25px;color:#d7baff;letter-spacing:1px;transition:color .3s}.note-readout span{font-family:Arial,Helvetica,sans-serif;font-size:9px;vertical-align:middle;margin-left:14px;letter-spacing:2px;color:#77748f}.instruction{margin:16px 0 0;color:#76758b;font-size:10px;letter-spacing:1px}.footer{position:absolute;left:7%;right:7%;bottom:5.2%;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #b4a4e018;padding-top:20px;color:#6a6981;font-size:9px;letter-spacing:1.5px}.footer-left{display:flex;align-items:center;gap:13px}.bars{display:flex;gap:3px;align-items:center;height:15px}.bars i{width:2px;height:5px;background:#ac8ce1;animation:bars 1.8s infinite ease-in-out}.bars i:nth-child(2){height:13px;animation-delay:-.6s}.bars i:nth-child(3){height:8px;animation-delay:-.9s}.bars i:nth-child(4){height:11px;animation-delay:-.3s}.footer-right{letter-spacing:2px;color:#b19bcd}.footer-right span{color:#615d75;margin:0 8px}@keyframes bars{50%{transform:scaleY(.35);opacity:.4}}.mote{position:absolute;width:2px;height:2px;border-radius:50%;background:#c1a3ed;box-shadow:0 0 9px #b798e8;pointer-events:none;animation:rise 1.5s ease-out forwards;z-index:5}@keyframes rise{from{opacity:1;transform:translate(0,0) scale(2)}to{opacity:0;transform:translate(var(--dx),-100px) scale(.3)}}@media(max-width:600px){.title h1{letter-spacing:-3px}.eyebrow{font-size:8px;letter-spacing:3px}.subtitle{font-size:10px}.instrument{left:4%;right:4%;height:23%;top:48%}.piano{padding:14px 8px 14px}.keys{gap:2px}.white .note{font-size:8px}.shortcut{display:none}.topline{font-size:8px;letter-spacing:1.5px}.live{font-size:7px}.footer{font-size:7px;letter-spacing:1px}.wave{left:15%;width:70%}}@media(prefers-reduced-motion:reduce){.bars i{animation:none}.mote{display:none}}
</style>
</head>
<body>
<main class="scene">
<canvas id="atmosphere" aria-hidden="true"></canvas><div class="grain"></div>
<header class="topline"><div class="brand"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 14V7m4 10V3m4 12V5m4 12V3m4 11V7" stroke="currentColor" stroke-width="1.5"/></svg> THE SOUND ROOM</div><div class="live"><i></i> NO. 004 / INTERACTIVE STUDY</div></header>
<div class="title"><p class="eyebrow">A LITTLE LIGHT. A LITTLE MUSIC.</p><h1>After <em>hours.</em></h1><p class="subtitle">An open invitation to make a little noise.</p></div>
<div class="halo"></div><div class="orbit"></div><canvas class="wave" id="wave" aria-hidden="true"></canvas>
<div class="underlight"></div><div class="instrument"><div class="piano"><div class="rail"></div><div class="keys" id="keys" aria-label="Interactive piano keyboard"></div></div></div>
<div class="feedback" aria-live="off"><div class="note-readout" id="readout">C major <span>THE NIGHT IS YOURS</span></div><p class="instruction" id="hint">Touch the keys or play with your keyboard</p></div>
<footer class="footer"><div class="footer-left"><div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div><span>EVERY NOTE LEAVES A LITTLE LIGHT</span></div><div class="footer-right">01 <span>—</span> 02 OCTAVES</div></footer>
</main>
<script>
(()=>{'use strict';
const scene=document.querySelector('.scene'),keys=document.getElementById('keys'),readout=document.getElementById('readout'),hint=document.getElementById('hint');
const notes=['C','D','E','F','G','A','B','C','D','E','F','G','A','B'];const semis=[0,2,4,5,7,9,11,12,14,16,17,19,21,23];const letters=['a','s','d','f','g','h','j','k','l',';','\'','z','x','c'];const map=new Map(),buttons=new Map();
let ctx=null,energy=0,lastFrequency=0,touched=false;const activeTimers=new Map();
function makeKey(midi,label,letter,black,index){const b=document.createElement('button');b.type='button';b.className='key '+(black?'black':'white')+(!black&&index%3===1?' cyan':'');b.setAttribute('aria-label',label+' '+(midi<72?'4':'5'));b.innerHTML=black?'<span class="shortcut">'+letter.toUpperCase()+'</span>':'<span class="note">'+label+'</span><span class="shortcut">'+letter.toUpperCase()+'</span>';if(black)b.style.left=((index+1)*100/14-2.225)+'%';b.addEventListener('pointerdown',e=>{e.preventDefault();engage();play(midi,true)});b.addEventListener('click',e=>{if(e.detail===0){engage();play(midi,true)}});keys.appendChild(b);map.set(letter,midi);buttons.set(midi,b)}
notes.forEach((n,i)=>makeKey(60+semis[i],n,letters[i],false,i));const sharps={0:'w',1:'e',3:'t',4:'y',5:'u',7:'o',8:'p',10:']',11:'v',12:'b'};Object.entries(sharps).forEach(([i,l])=>makeKey(61+semis[+i],notes[+i]+'♯',l,true,+i));
function engage(){touched=true;try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}hint.textContent='Let your fingers wander. There are no wrong notes.'}
function tone(midi){if(!ctx||ctx.state!=='running')return;const now=ctx.currentTime,f=440*Math.pow(2,(midi-69)/12);const gain=ctx.createGain();gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.13,now+.012);gain.gain.exponentialRampToValueAtTime(.045,now+.2);gain.gain.exponentialRampToValueAtTime(.001,now+1.8);gain.connect(ctx.destination);[1,2,3].forEach((harm,i)=>{const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.value=f*harm;g.gain.value=[1,.19,.065][i];osc.connect(g);g.connect(gain);osc.start(now);osc.stop(now+1.9)})}
function play(midi,sound){const b=buttons.get(midi);if(!b)return;b.classList.add('active');clearTimeout(activeTimers.get(midi));activeTimers.set(midi,setTimeout(()=>b.classList.remove('active'),550));energy=Math.min(energy+.65,1.5);lastFrequency=midi;const names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];readout.innerHTML=names[midi%12]+'<span>'+ (Math.floor(midi/12)-1)+' / '+(touched?'YOUR MELODY':'A MIDNIGHT PRELUDE')+'</span>';if(sound)tone(midi);const r=b.getBoundingClientRect(),sr=scene.getBoundingClientRect();for(let i=0;i<4;i++){const p=document.createElement('i');p.className='mote';p.style.left=(r.left-sr.left+r.width*.5+(Math.random()-.5)*16)+'px';p.style.top=(r.top-sr.top+r.height*.35)+'px';p.style.setProperty('--dx',(Math.random()-.5)*70+'px');scene.appendChild(p);setTimeout(()=>p.remove(),1600)}}
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const m=map.get(e.key.toLowerCase());if(m!==undefined){e.preventDefault();engage();play(m,true)}});
const canvas=document.getElementById('atmosphere'),c=canvas.getContext('2d'),wave=document.getElementById('wave'),wctx=wave.getContext('2d');let W,H,dpr;const stars=Array.from({length:66},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.3+.3,p:Math.random()*6.28}));function resize(){W=scene.clientWidth;H=scene.clientHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);wave.width=wave.clientWidth*dpr;wave.height=wave.clientHeight*dpr;wctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function draw(t){c.clearRect(0,0,W,H);stars.forEach(s=>{c.globalAlpha=.12+(.5+.5*Math.sin(t*.0004+s.p))*.35;c.fillStyle='#b6a0dc';c.beginPath();c.arc(s.x*W,s.y*H,s.s,0,Math.PI*2);c.fill()});c.globalAlpha=1;const horizon=H*.7;c.strokeStyle='#a17acf09';c.lineWidth=1;for(let i=-7;i<=7;i++){c.beginPath();c.moveTo(W/2+i*W*.017,horizon);c.lineTo(W/2+i*W*.19,H);c.stroke()}for(let i=0;i<7;i++){let y=horizon+(H-horizon)*Math.pow(i/7,2);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}const ww=wave.clientWidth,wh=wave.clientHeight;wctx.clearRect(0,0,ww,wh);energy*=.971;for(let layer=0;layer<3;layer++){wctx.beginPath();for(let x=0;x<=ww;x+=2){let envelope=Math.pow(Math.sin(x/ww*Math.PI),2);let amp=(2+energy*17)*(layer===0?1:.55);let y=wh/2+Math.sin(x*.035-t*.0017+layer*.7)*amp*envelope+Math.sin(x*.078+t*.001)*energy*5*envelope;if(x===0)wctx.moveTo(x,y);else wctx.lineTo(x,y)}wctx.strokeStyle=layer===0?'#bc91ec':layer===1?'#72cbd2':'#7155af';wctx.globalAlpha=layer===0?.65:.3;wctx.lineWidth=layer===0?1.3:1;wctx.shadowColor='#aa71f0';wctx.shadowBlur=8;wctx.stroke()}wctx.globalAlpha=1;if(!reduced)requestAnimationFrame(draw)}requestAnimationFrame(draw);
const melody=[[60,0],[64,420],[67,840],[71,1300],[69,1950],[67,2370],[64,2800],[62,3280],[65,3820],[69,4280],[72,4830],[67,5460],[64,5900],[60,6520]];setTimeout(()=>{melody.forEach(([m,t])=>setTimeout(()=>{if(!touched)play(m,false)},t));setTimeout(()=>{if(!touched){readout.innerHTML='C major <span>THE NIGHT IS YOURS</span>'}},7700)},1000);
})();
</script>
</body>
</html>
