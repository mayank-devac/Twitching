<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Orbit</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d32}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}.stage{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 49% 42%,#642c83 0,#32215f 36%,#17133f 70%,#0c1539 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.grain{position:absolute;inset:0;opacity:.16;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");mix-blend-mode:soft-light}.caption{position:absolute;left:clamp(28px,7vw,132px);top:clamp(30px,7vh,76px);pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#e8b7f0;opacity:.9}.title{font-size:clamp(32px,4vw,62px);line-height:1.06;font-weight:500;letter-spacing:-.045em;margin:13px 0 0;text-shadow:0 2px 28px #22145166}.subtitle{font-size:13px;letter-spacing:.08em;color:#d8bce7;margin-top:12px;opacity:.8}.signature{position:absolute;right:clamp(28px,6vw,114px);bottom:34px;color:#f1c2e6;font-size:10px;letter-spacing:.25em;text-transform:uppercase;opacity:.7}.horizon-glow{position:absolute;left:0;right:0;bottom:10%;height:32%;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,#f379ca30 0,transparent 65%)}
</style>
</head>
<body>
<main class="stage" aria-label="A glowing ball bouncing over a dreamlike landscape">
<canvas id="scene"></canvas><div class="horizon-glow"></div><div class="grain"></div>
<header class="caption"><div class="eyebrow">A small study in motion</div><h1 class="title">Little Orbit</h1><div class="subtitle">One bright thing, finding its way home.</div></header>
<div class="signature">Somewhere between falling &amp; flight</div>
</main>
<script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d');let w,h,dpr,stars=[],particles=[],last=0;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.floor(w*h/9500)},()=>({u:Math.random(),v:Math.random()*.72,r:Math.random()*1.5+.25,a:Math.random()*.55+.12,p:Math.random()*7}))}addEventListener('resize',resize);resize();const start=performance.now();function frame(now){let t=(now-start)/1000;x.clearRect(0,0,w,h);
// distant drifting flecks
for(const s of stars){let tw=.6+.4*Math.sin(t*1.1+s.p);x.beginPath();x.fillStyle=`rgba(255,225,255,${s.a*tw})`;x.arc(s.u*w,s.v*h,s.r,0,Math.PI*2);x.fill()}
// soft, layered hills
function hill(base,amp,phase,color){x.beginPath();x.moveTo(0,h);for(let i=0;i<=80;i++){let u=i/80,xx=u*w,yy=base+Math.sin(u*5.6+phase)*amp+Math.sin(u*12+phase*1.7)*amp*.22;x.lineTo(xx,yy)}x.lineTo(w,h);x.closePath();x.fillStyle=color;x.fill()}
hill(h*.76,h*.055,1.2,'#252057');hill(h*.82,h*.045,3.1,'#171b4b');
// curved luminous path across the valley
x.save();x.globalAlpha=.72;x.lineWidth=2;x.strokeStyle='#b978d6';x.shadowColor='#ff8be4';x.shadowBlur=18;x.beginPath();x.moveTo(0,h*.82);x.bezierCurveTo(w*.24,h*.75,w*.28,h*.91,w*.51,h*.84);x.bezierCurveTo(w*.72,h*.77,w*.82,h*.94,w,h*.82);x.stroke();x.globalAlpha=.26;x.lineWidth=17;x.stroke();x.restore();
// orb follows a looping bounce with a brief floating apex
let cx=w*(.5+.285*Math.sin(t*.47-.8)),floor=h*(.827+.025*Math.sin((cx/w)*Math.PI*2+1)),phase=(t*.72+.13)%1,arc=Math.pow(Math.sin(Math.PI*phase),.72),cy=floor-h*(.27*arc+.018),r=Math.min(w,h)*(.055+.009*arc);let impact=Math.pow(Math.max(0,1-arc),4),sx=1+impact*.19,sy=1-impact*.24;
// shadow and echo rings
x.save();x.globalAlpha=.24+.19*impact;x.fillStyle='#090d35';x.filter='blur(12px)';x.beginPath();x.ellipse(cx,floor+7,r*(1.45+.55*arc),r*.24,0,0,Math.PI*2);x.fill();x.filter='none';x.restore();
x.save();x.globalAlpha=.17+.18*arc;x.strokeStyle='#ffbcf2';x.lineWidth=1;x.beginPath();x.ellipse(cx,floor+2,r*(1.8+arc),r*.38,0,0,Math.PI*2);x.stroke();x.restore();
// trailing motes
for(let i=0;i<12;i++){let q=i/12,yy=cy+(floor-cy)*q*.43,xx=cx-Math.sin(t*2+i*.35)*q*14,rr=(1-q)*3.2; x.beginPath();x.fillStyle=`rgba(255,178,236,${(1-q)*.38})`;x.arc(xx,yy,rr,0,Math.PI*2);x.fill()}
// glassy rainbow orb
x.save();x.translate(cx,cy);x.scale(sx,sy);let g=x.createRadialGradient(-r*.34,-r*.42,r*.04,0,0,r*1.14);g.addColorStop(0,'#fff9ff');g.addColorStop(.12,'#fff0c9');g.addColorStop(.32,'#ffabed');g.addColorStop(.59,'#c261ed');g.addColorStop(.82,'#7166ef');g.addColorStop(1,'#37d9e8');x.shadowColor='#ee7dfd';x.shadowBlur=42;x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.fillStyle=g;x.fill();x.shadowBlur=0;
// inner flowing ribbons clipped to sphere
x.save();x.beginPath();x.arc(0,0,r*.98,0,Math.PI*2);x.clip();x.globalAlpha=.34;x.lineWidth=r*.14;for(let i=0;i<4;i++){x.strokeStyle=['#fff2ad','#ff65cb','#65f4e8','#9876ff'][i];x.beginPath();x.ellipse(-r*.12,r*.12,r*(.42+i*.08),r*(.16+i*.05),-.68+i*.38,Math.PI*1.05,Math.PI*1.95);x.stroke()}x.restore();
x.globalAlpha=.76;x.fillStyle='#fff';x.beginPath();x.ellipse(-r*.31,-r*.48,r*.17,r*.08,-.65,0,Math.PI*2);x.fill();x.globalAlpha=.34;x.beginPath();x.ellipse(r*.25,r*.38,r*.08,r*.035,-.55,0,Math.PI*2);x.fill();x.restore();
// faint orbiting sparks
for(let i=0;i<3;i++){let a=t*.7+i*2.1,px=cx+Math.cos(a)*r*1.55,py=cy+Math.sin(a)*r*.62;x.beginPath();x.fillStyle=`rgba(255,222,249,${.6+.3*Math.sin(t*2+i)})`;x.arc(px,py,2.2-i*.35,0,Math.PI*2);x.fill()}
requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script>
</body>
</html>
