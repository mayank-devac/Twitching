<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A little underwater world</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#072b35;font-family:Georgia,'Times New Roman',serif;color:#ebf3df}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.heading{position:absolute;top:6.2%;left:7.2%;pointer-events:none}.eyebrow{display:flex;align-items:center;gap:10px;font:10px Arial,sans-serif;letter-spacing:3px;color:#a6cfc6;text-transform:uppercase}.eyebrow:before{content:'';width:22px;height:1px;background:#8abbb0}h1{font-weight:normal;font-size:clamp(36px,5.5vw,62px);letter-spacing:-2px;line-height:1.07;margin:22px 0 15px}h1 i{color:#bdd5b7;font-weight:normal}.sub{font-size:14px;color:#b2cbc5;line-height:1.7;letter-spacing:.2px}.corner{position:absolute;top:6.4%;right:7%;display:flex;gap:8px;align-items:center;color:#a6cfc6;font:10px Arial,sans-serif;letter-spacing:2px;pointer-events:none}.dot{width:5px;height:5px;background:#afd5ab;border-radius:100%;box-shadow:0 0 12px #8bcbaa}.bottom{position:absolute;bottom:4.7%;left:7.2%;right:7.2%;display:flex;align-items:center;justify-content:space-between;pointer-events:none;color:#b0c5b3;font:10px Arial,sans-serif;letter-spacing:1.1px}.instruction{display:flex;align-items:center;gap:13px}.cursor{width:14px;height:18px;stroke:#b0c5b3;fill:none}.bottom span:last-child{font:italic 13px Georgia,serif;letter-spacing:.2px;color:#cfceac}.glass{position:absolute;inset:20px;border:1px solid #b4e2ca16;border-radius:3px;pointer-events:none}.glass:after{content:'';position:absolute;inset:6px;border:1px solid #b4e2ca08}@media(max-width:550px){.heading{top:6%;left:8%}.corner{top:4%;font-size:8px}.sub{font-size:12px}h1{font-size:42px}.bottom{font-size:8px;left:8%;right:8%}.bottom span:last-child{font-size:11px}.glass{inset:12px}}
</style>
</head>
<body>
<canvas id="water" aria-label="A peaceful animated aquarium with gold and silver fish. Move your pointer to guide the fish and click to drop food."></canvas>
<div class="glass"></div>
<div class="heading"><div class="eyebrow">A small living world</div><h1>A moment<br><i>beneath the surface.</i></h1><div class="sub">Slow down. Stay a little.<br>There is a whole world in here.</div></div>
<div class="corner"><div class="dot"></div>LIVE AQUARIUM</div>
<div class="bottom"><div class="instruction"><svg class="cursor" viewBox="0 0 16 20"><path d="M2 1v14l4-4 3 6 3-1-3-6h6z"/></svg>MOVE TO WANDER · CLICK TO FEED</div><span>Let the world drift.</span></div>
<script>
(()=>{
const canvas=document.getElementById('water'),ctx=canvas.getContext('2d');let W,H,dpr,time=0,last=0;const pointer={x:0,y:0,active:false},food=[],ripples=[];const random=(a,b)=>a+Math.random()*(b-a);
const fish=Array.from({length:13},(_,i)=>({x:random(.18,.86),y:random(.38,.76),s:i<4?random(30,43):random(15,25),vx:random(-.6,.6),vy:0,a:Math.random()*6.28,phase:random(0,6.28),gold:i<6,depth:random(.65,1),seed:random(0,100),turn:1}));
const motes=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),s:random(.3,1.6),v:random(.002,.01),p:Math.random()*6}));
const bubbles=Array.from({length:24},()=>({x:random(.12,.89),y:Math.random(),r:random(1.4,4.8),v:random(.006,.024),p:random(0,6)}));
const plants=Array.from({length:35},(_,i)=>({x:i<15?random(-.03,.25):i<29?random(.76,1.04):random(.25,.82),h:i<29?random(.14,.36):random(.035,.115),w:random(4,13),p:random(0,6.3),color:i%3}));
const stones=Array.from({length:40},()=>({x:Math.random(),y:random(.894,.97),w:random(8,47),h:random(4,20),p:Math.random()}));
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);
canvas.addEventListener('pointermove',e=>{pointer.x=e.clientX/W;pointer.y=e.clientY/H;pointer.active=true});canvas.addEventListener('pointerleave',()=>pointer.active=false);canvas.addEventListener('pointerdown',e=>{pointer.x=e.clientX/W;pointer.y=e.clientY/H;pointer.active=true;for(let i=0;i<7;i++)food.push({x:e.clientX+random(-18,18),y:e.clientY+random(-8,8),v:random(13,22),life:0});ripples.push({x:e.clientX,y:e.clientY,r:2,life:1})});
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function background(){let g=ctx.createLinearGradient(0,0,W*.6,H);g.addColorStop(0,'#174e58');g.addColorStop(.34,'#10454b');g.addColorStop(.7,'#0b333a');g.addColorStop(1,'#061f2b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<6;i++){let x=W*(.26+i*.145)+Math.sin(time*.16+i)*25;let beam=ctx.createLinearGradient(x,0,x+W*.17,H*.9);beam.addColorStop(0,'rgba(166,220,193,.055)');beam.addColorStop(1,'rgba(136,201,174,0)');ctx.fillStyle=beam;ctx.beginPath();ctx.moveTo(x-25,0);ctx.lineTo(x+30,0);ctx.lineTo(x+W*.30,H);ctx.lineTo(x+W*.07,H);ctx.fill()}ctx.restore();
let glow=ctx.createRadialGradient(W*.65,H*.34,0,W*.65,H*.34,W*.58);glow.addColorStop(0,'#80b7a10d');glow.addColorStop(1,'#80b7a100');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#abd9c80a';ctx.lineWidth=1;for(let j=0;j<7;j++){ctx.beginPath();for(let x=0;x<W;x+=12){let y=H*(.026+j*.012)+Math.sin(x*.009+time*.26+j)*4+Math.sin(x*.023-time*.2)*2;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
}
function plant(p,front){let x=p.x*W,base=H*.92,h=p.h*H,sway=Math.sin(time*.6+p.p)*h*.085;ctx.save();ctx.translate(x,base);ctx.strokeStyle=['#386658','#315c50','#547761'][p.color];ctx.globalAlpha=front?.82:.42;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-sway,-h*.35,sway,-h*.7,sway,-h);ctx.stroke();for(let j=1;j<8;j++){let k=j/8,y=-h*k,cx=Math.sin(k*3)*sway;for(let side of [-1,1]){let l=h*(.12+Math.sin(k*3)*.05),xx=cx+side*l;ctx.fillStyle=['#386854','#2c6151','#5b7b58'][p.color];ctx.beginPath();ctx.moveTo(cx,y);ctx.bezierCurveTo(cx+side*l*.2,y-l*.45,xx,y-l*.58,xx,y-l*.7);ctx.bezierCurveTo(xx+side*4,y-l*.15,cx+side*l*.3,y+3,cx,y);ctx.fill()}}ctx.restore()}
function grass(){for(let i=0;i<45;i++){let x=(i<23?i/23*.22:.78+(i-23)/22*.24)*W,h=(.035+(Math.sin(i*12.2)+1)*.035)*H;ctx.strokeStyle=i%2?'#68835b85':'#416951aa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,H*.93);ctx.quadraticCurveTo(x+Math.sin(i)*12,H*.93-h*.7,x+Math.sin(time*.7+i)*9,H*.93-h);ctx.stroke()}}
function drawFish(f,dt){const scale=Math.min(W/960,H/1044),sz=f.s*scale,x=f.x*W,y=f.y*H;let tx,ty,targetFood=null;if(food.length){let nearest=Infinity;for(const pellet of food){let d=Math.hypot(pellet.x-x,pellet.y-y);if(d<nearest){nearest=d;targetFood=pellet}}tx=targetFood.x/W;ty=targetFood.y/H;if(nearest<sz*.65){food.splice(food.indexOf(targetFood),1);targetFood=null}}else if(pointer.active){tx=pointer.x+Math.cos(f.seed)*.06;ty=pointer.y+Math.sin(f.seed)*.055}else{tx=.50+Math.sin(time*.13+f.seed)*.32;ty=.56+Math.cos(time*.17+f.seed)*.17}
let dx=tx-f.x,dy=ty-f.y;let distance=Math.hypot(dx,dy),speed=food.length?.075:pointer.active?.045:.023;let desiredX=dx/Math.max(distance,.05)*speed,desiredY=dy/Math.max(distance,.05)*speed;f.vx+=(desiredX-f.vx)*Math.min(1,dt*1.3);f.vy+=(desiredY-f.vy)*Math.min(1,dt*1.3);f.x+=f.vx*dt;f.y+=f.vy*dt;f.x=Math.max(.035,Math.min(.965,f.x));f.y=Math.max(.13,Math.min(.88,f.y));let dir=f.vx>=0?1:-1;f.turn+=(dir-f.turn)*Math.min(1,dt*5);let tilt=Math.atan2(f.vy*H,Math.abs(f.vx)*W+.1)*dir;const wag=Math.sin(time*(food.length?10:6)+f.phase);
ctx.save();ctx.translate(x,y);ctx.rotate(tilt*.5);ctx.scale(f.turn,f.depth);ctx.globalAlpha=.92;ctx.shadowColor=f.gold?'#e6b15a33':'#aed9cf20';ctx.shadowBlur=12;
let tail=ctx.createLinearGradient(-sz*1.75,0,-sz*.65,0);tail.addColorStop(0,f.gold?'#c5893b88':'#73b2ad77');tail.addColorStop(1,f.gold?'#e7ad58':'#a5d0c3');ctx.fillStyle=tail;ctx.beginPath();ctx.moveTo(-sz*.65,0);ctx.bezierCurveTo(-sz*1.12,-sz*.12,-sz*1.35,-sz*.65,-sz*1.65,-sz*.65+wag*sz*.13);ctx.quadraticCurveTo(-sz*1.38,wag*sz*.2,-sz*1.65,sz*.65+wag*sz*.13);ctx.bezierCurveTo(-sz*1.33,sz*.55,-sz,sz*.12,-sz*.65,0);ctx.fill();
ctx.fillStyle=f.gold?'#d6a55c88':'#83b7aa77';ctx.beginPath();ctx.moveTo(-sz*.5,-sz*.29);ctx.quadraticCurveTo(-sz*.12,-sz*.9,sz*.38,-sz*.31);ctx.fill();ctx.beginPath();ctx.moveTo(-sz*.4,sz*.25);ctx.quadraticCurveTo(-sz*.06,sz*.7,sz*.34,sz*.28);ctx.fill();
let body=ctx.createLinearGradient(0,-sz*.45,0,sz*.45);if(f.gold){body.addColorStop(0,'#f6d79a');body.addColorStop(.35,'#eeb55d');body.addColorStop(.7,'#c98238');body.addColorStop(1,'#80532e')}else{body.addColorStop(0,'#d1e5ce');body.addColorStop(.4,'#94c8bd');body.addColorStop(1,'#3f776e')}ellipse(0,0,sz,sz*.40,body);ctx.shadowBlur=0;
ctx.strokeStyle=f.gold?'#fff3ce23':'#eefae523';ctx.lineWidth=.6;for(let j=-3;j<3;j++){ctx.beginPath();ctx.arc(j*sz*.22,-sz*.02,sz*.26,-1.05,1.05);ctx.stroke()}ctx.strokeStyle=f.gold?'#81582966':'#3c786d88';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sz*.43,0,sz*.26,-1.1,1.1);ctx.stroke();ctx.fillStyle=f.gold?'#edc57f77':'#b2d3ba88';ctx.beginPath();ctx.moveTo(sz*.12,sz*.06);ctx.quadraticCurveTo(-sz*.25,sz*(.65+wag*.06),-sz*.34,sz*.19);ctx.closePath();ctx.fill();ellipse(sz*.69,-sz*.09,sz*.073,sz*.073,'#f9eac5');ellipse(sz*.708,-sz*.09,sz*.042,sz*.049,'#172d2e');ellipse(sz*.72,-sz*.107,sz*.015,sz*.016,'#ffffffcc');ctx.restore()}
function scene(t){let dt=Math.min((t-last)/1000,.04)||.016;last=t;time=t/1000;background();for(const p of plants)plant(p,false);
for(const m of motes){m.y-=m.v*dt;if(m.y<0)m.y=1;ellipse((m.x+Math.sin(time*.2+m.p)*.008)*W,m.y*H,m.s,m.s,'#d1edcb'+(m.s>1?'28':'17'))}
for(const b of bubbles){b.y-=b.v*dt;if(b.y<-.02)b.y=1;let x=b.x*W+Math.sin(time*.7+b.p)*8,y=b.y*H;ctx.strokeStyle='#b8e5d52b';ctx.lineWidth=.7;ctx.beginPath();ctx.arc(x,y,b.r,0,6.28);ctx.stroke();ellipse(x-b.r*.28,y-b.r*.35,b.r*.17,b.r*.12,'#d5f0de66')}
for(const f of fish)drawFish(f,dt);
for(let i=food.length-1;i>=0;i--){let p=food[i];p.y+=p.v*dt;p.x+=Math.sin(time+p.life)*dt*4;p.life+=dt;ellipse(p.x,p.y,2.3,1.8,'#e8c582');if(p.y>H*.91||p.life>22)food.splice(i,1)}
for(let i=ripples.length-1;i>=0;i--){let r=ripples[i];r.r+=dt*40;r.life-=dt*.6;ctx.strokeStyle=`rgba(207,227,192,${Math.max(0,r.life)*.27})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.4,0,0,6.28);ctx.stroke();if(r.life<=0)ripples.splice(i,1)}
let sand=ctx.createLinearGradient(0,H*.87,0,H);sand.addColorStop(0,'#88947500');sand.addColorStop(.38,'#68795b');sand.addColorStop(1,'#384c42');ctx.fillStyle=sand;ctx.beginPath();ctx.moveTo(0,H*.885);ctx.bezierCurveTo(W*.23,H*.91,W*.37,H*.87,W*.54,H*.902);ctx.bezierCurveTo(W*.7,H*.94,W*.87,H*.88,W,H*.895);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
for(let i=0;i<270;i++){let x=((i*137.508)%997)/997*W,y=H*(.915+((i*71)%97)/97*.08);ellipse(x,y,.5+i%3*.25,.4,i%2?'#c4c5a02b':'#172d2d35')}
for(const r of stones){let g=ctx.createLinearGradient(0,r.y*H-r.h,0,r.y*H+r.h);g.addColorStop(0,r.p>.5?'#7c8c75':'#637e73');g.addColorStop(1,'#2c4540');ellipse(r.x*W,r.y*H,r.w,r.h,g)}
for(let i=0;i<plants.length;i++)if(i%2===0)plant(plants[i],true);grass();
let vignette=ctx.createRadialGradient(W*.5,H*.5,W*.2,W*.5,H*.5,W*.8);vignette.addColorStop(0,'#031c2600');vignette.addColorStop(1,'#03151f66');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);requestAnimationFrame(scene)}
requestAnimationFrame(scene);
})();
</script>
</body>
</html>
