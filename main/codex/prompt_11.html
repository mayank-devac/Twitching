<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stillwater · A Living Aquarium</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#111c21;color:#e8e9df;font-family:Arial,Helvetica,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}.identity{position:absolute;top:42px;left:54px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:3.8px;color:#b7cecd;font-weight:600}.identity h1{font-family:Georgia,'Times New Roman',serif;font-size:43px;letter-spacing:-1.5px;font-weight:400;margin:12px 0 8px}.subtitle{font-size:12px;letter-spacing:.6px;color:#a7c1c1}.live{position:absolute;right:52px;top:47px;display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:2.3px;color:#bad0cc;pointer-events:none}.live i{width:5px;height:5px;background:#b7d5ad;border-radius:50%;box-shadow:0 0 12px #b7d5ad75}.instruction{position:absolute;bottom:15.5%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:13px;color:#d1e0d5aa;font-size:11px;letter-spacing:1px;white-space:nowrap;pointer-events:none}.instruction svg{width:18px;height:22px;opacity:.8}.footer{position:absolute;bottom:27px;left:54px;right:52px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;color:#87938e;font-size:10px;letter-spacing:2px}.footer .label{display:flex;gap:16px;align-items:center}.footer .line{height:1px;width:31px;background:#798c82}.footer .readings{display:flex;gap:35px}.readings b{font-weight:400;color:#d5d9cd;margin-left:8px;letter-spacing:.8px}.glass{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 75px #0006,inset 0 1px 0 #d0ffff40}.feed-note{position:absolute;top:100px;right:52px;font-family:Georgia,serif;font-size:15px;font-style:italic;color:#e2d6b7;opacity:0;transition:opacity .5s;pointer-events:none}.feed-note.show{opacity:1}@media(max-width:700px){.identity{left:25px;top:28px}.identity h1{font-size:34px}.live{right:25px;top:33px}.live span{display:none}.footer{left:25px;right:25px;bottom:20px}.footer .readings{gap:12px}.footer .label{font-size:8px}.instruction{font-size:9px;bottom:17%}.subtitle{font-size:10px}.feed-note{right:25px;top:65px}}
</style>
</head>
<body>
<canvas id="aquarium" aria-label="A living freshwater aquarium. Click the water to drop food and watch the fish gather."></canvas>
<div class="identity"><div class="eyebrow">A LITTLE WORLD, UNDERWATER</div><h1>Stillwater</h1><div class="subtitle">Let the world outside drift away.</div></div>
<div class="live"><i></i><span>A LIVING AQUARIUM</span></div>
<div class="feed-note" id="note">A little something for the shoal.</div>
<div class="instruction"><svg viewBox="0 0 20 24" fill="none"><path d="M7 12V4a2 2 0 0 1 4 0v6l1-1 5 3v6c0 3-2 5-5 5h-2c-2 0-3-1-4-3l-4-6c-1-2 1-3 2-2l3 3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 5l-1-1m3-3V0m10 3 1-1" stroke="currentColor" stroke-linecap="round"/></svg><span>Touch the water to feed the fish</span></div>
<div class="footer"><div class="label"><span class="line"></span> THE FRESHWATER COLLECTION <span style="color:#60756c">/</span> No. 001</div><div class="readings"><span>WATER <b>24°C</b></span><span>pH <b>7.2</b></span></div></div>
<div class="glass"></div>
<script>
(()=>{
const canvas=document.getElementById('aquarium'),ctx=canvas.getContext('2d');let W,H,D,bed,waterEnd,scene,tick=0,last=0;const fish=[],foods=[],bubbles=[],ripples=[];let seed=217;const rand=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};const range=(a,b)=>a+rand()*(b-a);
function ellipse(c,x,y,rx,ry,color,rotation=0){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rotation,0,Math.PI*2);c.fillStyle=color;c.fill()}
function stone(c,x,y,r,tone){c.save();c.translate(x,y);c.rotate(range(-.4,.4));const points=[];for(let k=0;k<12;k++){const a=k/12*Math.PI*2;points.push([Math.cos(a)*r*range(.85,1.1),Math.sin(a)*r*.64*range(.85,1.08)])}let g=c.createLinearGradient(-r,-r,r,r);g.addColorStop(0,`rgb(${tone+35},${tone+39},${tone+27})`);g.addColorStop(.45,`rgb(${tone},${tone+7},${tone})`);g.addColorStop(1,`rgb(${tone-27},${tone-18},${tone-20})`);c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fillStyle=g;c.fill();c.save();c.clip();for(let i=0;i<r*4;i++){const px=range(-r,r),py=range(-r,r);ellipse(c,px,py,range(.3,1.8),range(.3,1),'rgba(8,20,14,.18)')}for(let j=0;j<4;j++){c.beginPath();c.moveTo(range(-r,r),-r);c.bezierCurveTo(-r*.4,0,r*.6,-r*.2,range(-r,r),r);c.strokeStyle='rgba(194,200,168,.08)';c.lineWidth=range(1,3);c.stroke()}c.restore();c.restore()}
const plants=[];
function plant(x,y,height,width,color,kind){plants.push({x,y,height,width,color,kind,phase:rand()*6.28})}
function build(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);waterEnd=H*.893;bed=H*.817;seed=217;scene=document.createElement('canvas');scene.width=W*D;scene.height=H*D;const c=scene.getContext('2d');c.scale(D,D);let g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#092f3c');g.addColorStop(.35,'#155563');g.addColorStop(.68,'#154953');g.addColorStop(1,'#163c3b');c.fillStyle=g;c.fillRect(0,0,W,H);
let glow=c.createRadialGradient(W*.53,H*.05,0,W*.53,H*.1,W*.58);glow.addColorStop(0,'rgba(111,176,166,.3)');glow.addColorStop(1,'rgba(10,44,48,0)');c.fillStyle=glow;c.fillRect(0,0,W,waterEnd);
// Distant rock silhouettes and the soft, planted rear of the tank.
for(let i=0;i<35;i++){const x=rand()*W,y=bed+range(-9,45),r=range(25,85);ellipse(c,x,y,r,r*.63,'#173d3b')}
for(let i=0;i<160;i++){const x=rand()*W,h=range(30,160);c.beginPath();c.moveTo(x,bed+15);c.quadraticCurveTo(x+range(-45,45),bed-h*.5,x+range(-25,25),bed-h);c.strokeStyle=`rgba(40,81,62,${range(.15,.4)})`;c.lineWidth=range(2,6);c.stroke()}
let soil=c.createLinearGradient(0,bed-15,0,waterEnd);soil.addColorStop(0,'#464c3c');soil.addColorStop(.3,'#737460');soil.addColorStop(1,'#393d30');c.beginPath();c.moveTo(0,bed+15);for(let x=0;x<=W+20;x+=20)c.lineTo(x,bed+Math.sin(x*.007)*9+Math.sin(x*.021)*3);c.lineTo(W,waterEnd);c.lineTo(0,waterEnd);c.closePath();c.fillStyle=soil;c.fill();
for(let i=0;i<Math.floor(W*H/85);i++){let x=rand()*W,y=range(bed-7,waterEnd);if(y<bed+Math.sin(x*.007)*9)continue;const r=range(.7,3.7)*(1+(y-bed)/90);const shades=['#77796a','#9a9780','#545d50','#afb09a','#454e42','#797566','#c0b99b'];ellipse(c,x,y+r*.5,r*1.08,r*.64,'#152b2880');ellipse(c,x,y,r,r*.63,shades[Math.floor(rand()*shades.length)],rand()*3);if(r>2)ellipse(c,x-r*.25,y-r*.23,r*.4,r*.14,'#d6d2af35')}
// Asymmetric river stones, anchored in the gravel.
[[.069,.825,43,78],[.13,.826,74,73],[.197,.83,43,68],[.298,.849,27,91],[.668,.851,28,79],[.811,.831,65,79],[.87,.823,94,80],[.937,.842,46,63]].forEach(([x,y,r,t])=>{ellipse(c,W*x,H*y+r*.29,r*1.25,r*.2,'#17282095');stone(c,W*x,H*y,r*W/1920,t)});
// The lower glass lip and solid walnut cabinet.
g=c.createLinearGradient(0,waterEnd-6,0,waterEnd+13);g.addColorStop(0,'#101f1d');g.addColorStop(.3,'#52635a');g.addColorStop(.42,'#263c34');g.addColorStop(.65,'#0a1615');g.addColorStop(1,'#121d1a');c.fillStyle=g;c.fillRect(0,waterEnd-5,W,20);
g=c.createLinearGradient(0,waterEnd+14,0,H);g.addColorStop(0,'#35332a');g.addColorStop(.1,'#252823');g.addColorStop(.7,'#1b211e');g.addColorStop(1,'#171c1a');c.fillStyle=g;c.fillRect(0,waterEnd+14,W,H-waterEnd);for(let i=0;i<200;i++){c.beginPath();let y=range(waterEnd+16,H);c.moveTo(0,y);c.bezierCurveTo(W*.3,y+range(-4,4),W*.7,y+range(-4,4),W,y+range(-3,3));c.strokeStyle=rand()>.5?'#a4946610':'#050e0b28';c.lineWidth=range(.3,1.4);c.stroke()}c.fillStyle='#0a141260';c.fillRect(W*.333,waterEnd+20,1,H);c.fillRect(W*.667,waterEnd+20,1,H);c.fillStyle='#68706324';c.fillRect(0,waterEnd+14,W,1);
plants.length=0;for(let i=0;i<20;i++)plant(range(.015,.25)*W,bed+range(-3,25),range(70,230)*H/1044,range(13,27),i%3?'#487d52':'#73985e',i%2);for(let i=0;i<23;i++)plant(range(.76,.99)*W,bed+range(-8,28),range(65,255)*H/1044,range(12,28),i%3?'#3b7551':'#719256',i%2);for(let i=0;i<9;i++)plant(range(.38,.57)*W,bed+range(4,23),range(35,80)*H/1044,range(9,15),'#6f9260',1);
if(!fish.length){for(let i=0;i<25;i++){let type=i<7?'gold':i<18?'neon':i<21?'angel':'silver';fish.push({x:range(.12,.88)*W,y:range(.27,.73)*H,size:(type==='gold'?range(32,44):type==='angel'?range(45,55):type==='neon'?range(17,23):range(24,32))*Math.min(W/1600,1.15),vx:range(.35,1)*(rand()>.5?1:-1),vy:0,type,phase:rand()*6.28,dir:rand()>.5?1:-1,depth:range(.7,1),turn:0})}}}
function drawPlant(p,t){let sway=Math.sin(t*.65+p.phase)*p.height*.027;const c=ctx;c.save();c.translate(p.x,p.y);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(sway*.3,-p.height*.5,sway,-p.height);c.strokeStyle='#335d3f';c.lineWidth=2;c.stroke();if(p.kind===0){for(let j=0;j<9;j++){let y=-p.height*j/10,x=sway*(j/10)**2,s=j%2?1:-1,len=p.width*(1-j/13);c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x+s*len*1.5,y+7,x+s*len*1.4,y-18,x+s*len*.6,y-25);c.bezierCurveTo(x+s*len*.7,y-14,x+s*len*.2,y-4,x,y);let g=c.createLinearGradient(x,y,x+s*len,y-20);g.addColorStop(0,'#254d37');g.addColorStop(.5,p.color);g.addColorStop(1,'#799a5b');c.fillStyle=g;c.fill();c.beginPath();c.moveTo(x,y);c.lineTo(x+s*len*.65,y-21);c.strokeStyle='#93b47a35';c.lineWidth=.7;c.stroke()}}else{for(let j=0;j<5;j++){const s=j%2?1:-1,tipX=s*p.width+Math.sin(t*.7+p.phase+j)*9,tipY=-p.height*(.6+j*.095);c.beginPath();c.moveTo(0,0);c.bezierCurveTo(s*p.width*.25,-p.height*.25,tipX+s*13,tipY*.78,tipX,tipY);c.bezierCurveTo(tipX-s*5,tipY*.72,s*2,-p.height*.27,0,0);c.fillStyle=j%2?p.color:'#345f40';c.fill();c.strokeStyle='#a0bd7430';c.lineWidth=.7;c.stroke()}}c.restore()}
function drawFish(f,t){const c=ctx,s=f.size,tail=Math.sin(t*6+f.phase),facing=f.dir;c.save();c.translate(f.x,f.y);c.scale(facing,1);c.rotate(Math.max(-.18,Math.min(.18,f.vy*.13*facing)));c.globalAlpha=f.depth;
if(f.type==='angel'){c.beginPath();c.moveTo(-s*.2,0);c.quadraticCurveTo(-s*.4,-s*.65,s*.22,-s*1.14);c.lineTo(s*.4,-s*.12);c.lineTo(s*.35,s*.3);c.lineTo(-s*.07,s*1.12);c.quadraticCurveTo(-s*.6,s*.7,-s*.2,0);let g=c.createLinearGradient(-s,0,s,0);g.addColorStop(0,'#778e86');g.addColorStop(.5,'#d2d1ab');g.addColorStop(1,'#778d78');c.fillStyle=g;c.fill();c.beginPath();c.moveTo(-s*.32,0);c.lineTo(-s*(.98+.07*tail),-s*.36);c.quadraticCurveTo(-s*.8,0,-s*(.98+.07*tail),s*.37);c.closePath();c.fillStyle='#b3bea07a';c.fill();ellipse(c,0,0,s*.52,s*.65,g);for(let i=-1;i<3;i++){c.beginPath();c.moveTo(s*(i*.22-.16),-s*.51);c.quadraticCurveTo(s*(i*.22-.3),0,s*(i*.22-.18),s*.55);c.strokeStyle='#293c39ba';c.lineWidth=s*.1;c.stroke()}c.beginPath();c.moveTo(s*.23,s*.3);c.quadraticCurveTo(s*.2,s*1.2,-s*.35,s*1.45);c.strokeStyle='#d4d1ab8a';c.lineWidth=1;c.stroke();ellipse(c,s*.34,-s*.1,s*.055,s*.067,'#e2ce72');ellipse(c,s*.36,-s*.1,s*.03,s*.042,'#101c17')}
else{let gold=f.type==='gold',neon=f.type==='neon';const bh=gold?s*.43:s*.28;let g=c.createLinearGradient(0,-bh,0,bh);if(gold){g.addColorStop(0,'#e8b657');g.addColorStop(.35,'#f4b956');g.addColorStop(.7,'#c67d30');g.addColorStop(1,'#966030')}else if(neon){g.addColorStop(0,'#1e8998');g.addColorStop(.45,'#67d5cf');g.addColorStop(.6,'#d2ceac');g.addColorStop(1,'#745c4b')}else{g.addColorStop(0,'#759c9b');g.addColorStop(.45,'#c4c9b0');g.addColorStop(1,'#62877b')}
c.beginPath();c.moveTo(-s*.7,0);c.bezierCurveTo(-s*.95,-s*.08,-s*(1.3+.1*tail),-s*.48,-s*1.38,-s*.35);c.quadraticCurveTo(-s*1.17,0,-s*1.38,s*.36);c.quadraticCurveTo(-s*1.1,s*.35,-s*.7,0);c.fillStyle=gold?'#d99c4bb0':neon?'#638f9460':'#a6bfa177';c.fill();for(let j=-2;j<3;j++){c.beginPath();c.moveTo(-s*.7,0);c.lineTo(-s*1.29,s*j*.13+tail*s*.045);c.strokeStyle=gold?'#f3ca7655':'#a8c9b54a';c.lineWidth=.8;c.stroke()}
c.beginPath();c.moveTo(-s*.5,-bh*.5);c.quadraticCurveTo(-s*.3,-s*.78,s*.18,-bh*.6);c.fillStyle=gold?'#dba75199':'#87aaa575';c.fill();c.beginPath();c.moveTo(-s*.18,bh*.6);c.quadraticCurveTo(-s*.22,s*.65,s*.35,bh*.6);c.fillStyle=gold?'#dfa75580':'#96b1a066';c.fill();ellipse(c,0,0,s*.86,bh,g);if(neon){c.save();c.beginPath();c.ellipse(0,0,s*.86,bh,0,0,Math.PI*2);c.clip();c.fillStyle='#de543d';c.fillRect(-s*.85,s*.07,s*.95,s*.2);c.shadowColor='#5aeee1';c.shadowBlur=5;c.fillStyle='#68ede6';c.fillRect(-s*.78,-s*.065,s*1.36,s*.09);c.restore()}else if(gold){for(let row=0;row<4;row++)for(let j=0;j<8;j++){let x=-s*.55+j*s*.145+(row%2)*s*.07,y=(row-1.5)*s*.16;if((x*x)/(s*s*.65)+(y*y)/(bh*bh)<.8){c.beginPath();c.arc(x,y,s*.095,-.9,.9);c.strokeStyle='#ffe39b25';c.lineWidth=.6;c.stroke()}}}c.beginPath();c.moveTo(s*.34,-bh*.7);c.quadraticCurveTo(s*.12,0,s*.36,bh*.72);c.strokeStyle=gold?'#8a5f3260':'#1b575656';c.lineWidth=1;c.stroke();c.beginPath();c.moveTo(s*.15,0);c.quadraticCurveTo(-s*.05+tail*s*.08,s*.42,-s*.28,s*.22);c.quadraticCurveTo(-s*.1,s*.04,s*.15,0);c.fillStyle=gold?'#ffe0a062':'#c3d8bc60';c.fill();ellipse(c,s*.6,-bh*.24,s*.075,s*.078,gold?'#eac26a':'#c4cfc0');ellipse(c,s*.615,-bh*.24,s*.039,s*.049,'#111f1f');ellipse(c,s*.625,-bh*.31,s*.013,s*.014,'#eff4de');c.beginPath();c.moveTo(s*.8,bh*.04);c.lineTo(s*.87,bh*.09);c.strokeStyle='#283b3055';c.lineWidth=1;c.stroke()}
c.restore()}
for(let i=0;i<40;i++)bubbles.push({x:rand(),y:rand(),r:range(.8,3),speed:range(9,28),phase:rand()*6.28});
function frame(ms){let dt=Math.min((ms-last)/1000,.04)||.016;last=ms;tick+=dt;ctx.clearRect(0,0,W,H);ctx.drawImage(scene,0,0,W,H);ctx.save();ctx.beginPath();ctx.rect(0,0,W,waterEnd-5);ctx.clip();
// Broad shafts of daylight from the water surface.
ctx.globalCompositeOperation='screen';for(let i=0;i<6;i++){let x=W*(.23+i*.115)+Math.sin(tick*.11+i)*25;let g=ctx.createLinearGradient(x,0,x+W*.05,bed);g.addColorStop(0,'rgba(169,218,184,.035)');g.addColorStop(.7,'rgba(137,200,157,.015)');g.addColorStop(1,'rgba(137,200,157,0)');ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+W*.045,0);ctx.lineTo(x+W*.2,bed);ctx.lineTo(x+W*.05,bed);ctx.fillStyle=g;ctx.fill()}ctx.globalCompositeOperation='source-over';
for(let i=0;i<65;i++){let x=((i*137.89+Math.sin(tick*.13+i)*17)%W+W)%W,y=(i*83.7-tick*(2+i%4))%waterEnd;if(y<0)y+=waterEnd;ellipse(ctx,x,y,.6,.6,'#c4dfbd25')}
plants.forEach(p=>drawPlant(p,tick));
for(let i=foods.length-1;i>=0;i--){let p=foods[i];p.y+=dt*17;p.x+=Math.sin(tick*2+p.phase)*dt*4;p.life-=dt;if(p.y>bed-5||p.life<0){foods.splice(i,1);continue}ellipse(ctx,p.x,p.y,2,1.5,'#c79c58');ellipse(ctx,p.x-.5,p.y-.7,.8,.5,'#e7c686')}
fish.forEach((f,i)=>{let target=null,best=350*350;for(const p of foods){let d=(p.x-f.x)**2+(p.y-f.y)**2;if(d<best){best=d;target=p}}let speed=f.type==='neon'?38:f.type==='angel'?15:23;if(target){let dx=target.x-f.x,dy=target.y-f.y,d=Math.hypot(dx,dy);f.vx+=(dx/Math.max(d,1)*2.3-f.vx)*dt*2;f.vy+=(dy/Math.max(d,1)*2.3-f.vy)*dt*2;if(d<f.size*.6){let idx=foods.indexOf(target);if(idx>=0)foods.splice(idx,1);ripples.push({x:target.x,y:target.y,r:2,life:.55,small:true})}}else{let desired=Math.sin(tick*.15+f.phase)*.12;f.vy+=(desired-f.vy)*dt*.7;if(Math.abs(f.vx)<.45)f.vx+=f.dir*dt*.25;f.vx+=(f.dir*.8-f.vx)*dt*.3;if(f.x<W*.045)f.vx+=dt*1.7;if(f.x>W*.955)f.vx-=dt*1.7;if(f.y<H*.23)f.vy+=dt*.55;if(f.y>bed-f.size*1.7)f.vy-=dt*.7}if(Math.abs(f.vx)>.08)f.dir=f.vx>0?1:-1;f.x+=f.vx*speed*dt;f.y+=f.vy*speed*dt+Math.sin(tick*1.3+f.phase)*dt*2;f.x=Math.max(-30,Math.min(W+30,f.x));f.y=Math.max(70,Math.min(bed-25,f.y));drawFish(f,tick)});
for(const b of bubbles){b.y-=dt*b.speed/H;if(b.y<.03){b.y=.81;b.x=.065+Math.random()*.025}let x=b.x*W+Math.sin(tick+b.phase)*7,y=b.y*H;ctx.beginPath();ctx.arc(x,y,b.r,0,Math.PI*2);ctx.strokeStyle='#cce5cf35';ctx.lineWidth=.7;ctx.stroke();ellipse(ctx,x-b.r*.3,y-b.r*.4,b.r*.25,b.r*.13,'#e4efda65')}
for(let i=ripples.length-1;i>=0;i--){let r=ripples[i];r.r+=dt*(r.small?14:48);r.life-=dt;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.32,0,0,Math.PI*2);ctx.strokeStyle=`rgba(216,232,196,${Math.max(0,r.life)*.2})`;ctx.lineWidth=1;ctx.stroke();if(r.life<=0)ripples.splice(i,1)}
// A quiet shimmer along the top pane.
ctx.beginPath();for(let x=0;x<=W;x+=12){let y=8+Math.sin(x*.008+tick*.7)*2+Math.sin(x*.022-tick*.4)*1.2;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle='#a3cbc536';ctx.lineWidth=1;ctx.stroke();ctx.restore();requestAnimationFrame(frame)}
let noteTimer;canvas.addEventListener('pointerdown',e=>{if(e.clientY>waterEnd)return;for(let i=0;i<12;i++)foods.push({x:e.clientX+(Math.random()-.5)*45,y:Math.max(18,e.clientY)+(Math.random()-.5)*18,phase:Math.random()*6.28,life:35});if(foods.length>100)foods.splice(0,foods.length-100);ripples.push({x:e.clientX,y:e.clientY,r:4,life:2.2});const note=document.getElementById('note');note.classList.add('show');clearTimeout(noteTimer);noteTimer=setTimeout(()=>note.classList.remove('show'),3200)});window.addEventListener('resize',()=>{let oldW=W,oldH=H;build();fish.forEach(f=>{f.x=f.x/oldW*W;f.y=f.y/oldH*H})});build();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
